[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff247"
version = "0.6.0"
description = "Turn a project folder into a handoff pack: diagrams, structure, how the tools connect, who uses the application and what they see, an ontology graph, a wiki and an MCP server for AI assistants."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["handoff", "documentation", "architecture", "diagram", "mermaid", "onboarding", "ontology", "knowledge-graph", "llms-txt", "wiki", "mcp", "user-journey"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/unkkyuist/HandOff247"

[project.scripts]
handoff247 = "handoff247.cli:main"

[tool.setuptools]
packages = ["handoff247", "handoff247.analyzers"]
