name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Document HandOff247 itself
        run: python -m handoff247 build . -o handoff/self --date 2026-01-01
      - name: One-step run on a folder of projects
        run: python -m handoff247 tests/fixtures --workspace -o handoff/all --date 2026-01-01
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: tests/fixtures/mini
          output: handoff/mini
      - run: test -f handoff/mini/README.md && test -f handoff/mini/index.html
