s wiki\n\nThis wiki describes **Newsroom** for an AI assistant that has to answer questions about the project or change it. HandOff247 generated it by static analysis; it did not run the code and no language model wrote these pages.\n\n## Reading\n\n1. Start at [index.md](index.md). Open [overview.md](overview.md), then only the pages the question needs.\n2. Each page is one thing. `Relations` lists what it points to (→) and what points to it (←); follow those links.\n3. A `file:line` next to a statement is where it was observed. Open that source before you change code.\n4. *inferred* marks a conclusion, not an observation. Check it in the source before relying on it.\n   Text labelled *written by a language model* (and *(model)* in lists) was not checked by a person either.\n5. Something that is not in the wiki was not found. That does not mean it does not exist: code built from runtime strings, reflection or dependency-injection containers is not followed. Say that you do not know.\n6. [notes.md](notes.md) is the only human-written page. \"Not answered\" there is a question for a person.\n\n## Helping someone who uses the application\n\nThe user types in this wiki (`users/`) are the kinds of user the analysed application tells apart. They are not access levels of the wiki: read every flow you need, whoever it belongs to. Five ways in:\n\n- **From a user type:** `users/<name>.md` lists the screens, what each control does and who picks the work up next.\n- **From words on a screen:** [terms.md](terms.md) has every link, button, field label, heading and message, with the feature it leads to. The word a user says and the name in the code often differ; the page gives both.\n- **From an asset or a table:** `assets/` and `data/` say who provides it, what stores it and where it shows.\n- **From code:** a file page lists the features that run it under *runs for*; a feature page lists its code.\n- **From a request:** find the feature through the words, then read its page in `features/`: started from, what the code does, branches, hand-overs, what to check, not verified.\n\nTwo rules when you answer. The same word can be on several screens: name the screen and the user type, and if two candidates fit, show both instead of picking one. And a condition in the code is not a diagnosis: \"the article is only listed when status is in_review\" is what the code does, not proof of why this user's article is missing. Say what to check (*What to check* on the feature page) unless you have the live data or a log.\n\n## Classes\n\n| Class | Meaning |\n|---|---|\n| Project | The thing being handed over. |\n| Area | A top-level folder of the project. |\n| File | A file of the project (images and other assets are left out). |\n| Type | A class, record, struct, interface or enum defined in a file. |\n| Run mode | A way to start the program, picked by its first argument. |\n| Sub-command | A sub-command of a command-line parser. |\n| Dispatch table | A switch or mapping that turns an operation name into the code that handles it. |\n| Operation | One named operation of a dispatch table. |\n| HTTP route | An HTTP endpoint the program serves. |\n| MCP tool | A tool the program offers to AI clients over MCP. |\n| Environment variable | An environment variable the code reads or sets (operating-system variables are left out). |\n| Port | A network port number found in an address or a port setting. |\n| Package | A third-party package the project declares or imports. |\n| External host | A host name found in a URL. |\n| Command-line tool | A well-known program the project's scripts start; it has to be installed. |\n| Person | An author in the Git history. |\n| User type | A kind of user the analysed application tells apart, found from role checks. Not an access level of this pack. |\n| Screen | A template or page a user sees. |\n| Screen term | Words a user reads: a link, button, field label, heading, or a message the code shows. |\n| Function | Project code that a feature runs. Modelled once, however many features use it. |\n| Data table | A table named in an SQL statement. |\n| State | A column value that statements set or filter on, such as status = 'published'. |\n| Asset | A file users see or provide: shipped with the project, uploaded, generated, or kept in external storage. |\n\n## Relations\n\n| Relation | Read backwards | Meaning |\n|---|---|---|\n| contains | is part of | Project → area → file. |\n| defines | is defined in | The file holds the definition. |\n| imports | is imported by | Import or include statement. |\n| uses | is used by | The code names a type defined in the other file; a run mode uses a type. |\n| takes as a dependency | is a dependency of | Constructor parameter of that type. |\n| extends | is extended by | Base class or implemented interface. |\n| loads | is loaded by | A page loads a script or stylesheet. |\n| runs | is run by | A script or configuration starts the other file. |\n| refers to | is referred to by | A string in the file is the other file's path. |\n| references | is referenced by | Project reference in a build file. |\n| documents | is documented in | A document links to the file or shows the operation in an example. |\n| serves | is served by | A run mode passes requests to the dispatch table. |\n| exposes | is exposed by | A run mode registers the HTTP route. |\n| has operation | is an operation of | Key of the dispatch table. |\n| is handled by | handles | The file that holds the handler the table calls. |\n| calls | is called from | The file asks for the operation by name (over HTTP, a process or in-process). |\n| invokes | is invoked by | An MCP tool runs the operation. |\n| forwards to | receives from | An HTTP route hands the request to the dispatch table. |\n| reads | is read by | The file reads the environment variable. |\n| sets | is set by | The file sets the environment variable. |\n| mentions | is mentioned in | The host or port appears in the file. |\n| depends on | is a dependency of | The file declares or imports the package. |\n| starts | is started by | The file starts the command-line tool. |\n| has commits in | has commits by | Author in the Git history of the project. |\n| is open to | may use | Role check on the route, or none found (anyone). |\n| sees | is seen by | A route this user type may use shows the screen. |\n| shows | is shown by | The route renders the screen. |\n| is built on | is part of | The template extends or includes the other one. |\n| displays | is displayed on | The words are on the screen, or the route shows the message. |\n| leads to | is started from | The link, button or form of the term targets the route; a script of the screen calls it. |\n| redirects to | is reached by redirect from | The handler redirects to the other route. |\n| runs | runs for | The handler calls the function, directly or through other functions. |\n| reads | is read by | An SQL statement of the feature reads the table. |\n| writes | is written by | An SQL statement of the feature inserts, updates or deletes rows. |\n| has the state | is a state of | A literal column value found in a statement. |\n| sets | is set by | A statement of the feature sets the column to this value. |\n| lists only | is the filter of | A statement of the feature filters on this value. |\n| is tested by | tests | A template condition or a handler branch names the same column and value. |\n| hands over to | receives from | One feature sets a state that the other filters on. |\n| shows | appears on | The screen references the file. |\n| provides | is provided by | The feature receives the upload or writes the generated file. |\n| delivers | is delivered by | The route sends the file to the browser. |\n| has its name kept in | keeps the name of | The stored file name is written to a column of the table. |\n| takes its text from | words | The text of the term comes from a locale file. |\n\n## Writing\n\nDo not edit these pages: the next run overwrites them. Knowledge that should last goes into `examples/newsroom.notes.md`, under the heading of the thing it is about:\n\n- `## Project` — what the project is and its status\n- `## Topic: <name>` — the handover questions listed in [notes.md](notes.md)\n- `## Area: <folder>`, `## File: <path>`, `## Mode: <name>`, `## Op: <operation>` — one thing each\n- `## User: <user type>` — who these users are in real life and what they usually ask for\n\nWrite plain sentences, say only what you verified in the source, and never paste a password or token; say where it is kept. Then run `python -m handoff247 <project folder>` again: the note appears on the matching wiki page, in the handoff pages and in the viewer.\n\n## Files\n\n- `../llms.txt` — short entry point; `../llms-full.txt` — every page of this wiki in one file\n- `../ontology.json` — entities (`id`, `type`, `name`, `summary`, `page`) and relations (`s`, `p`, `o`, `file`, `line`)\n- `../index.html` — viewer with a graph of the same ontology\n\n## Working through MCP\n\n`python -m handoff247 mcp` is an MCP server over the same data: a briefing of the whole project, the flows of each user type, a search from a user's own words, one feature in full, assets, the effect of a code change, entities, source lines, what is still undocumented, and notes written under the right heading (marked as written by an agent). It is the supported way for an assistant to add to this wiki.\n", "wiki/overview.md": "---\ngenerator: HandOff247\nid: \"project:Newsroom\"\ntype: Project\n---\n\n# Newsroom\n\n**What the previous owner says it is**\n\n> A small publishing application that exists only as a test fixture for HandOff247 (`tests/fixtures/newsroom`). Authors write articles and upload a cover image, editors review and publish them, and readers see the published articles on the front page. It is not deployed anywhere; the notes below are example text.\n\n- **Repository:** https://github.com/unkkyuist/HandOff247 at commit `3cdb94f`\n- **H <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TABS = [['README.md', 'Overview'], ['HANDOVER.md', 'Handover'], ['USERS.md', 'Users'], ['RUNNING.md', 'Running'], ['CONNECTIONS.md', 'Connections'],
  ['CODEMAP.md', 'Code map'], ['FILES.md', 'Files'], ['@graph', 'Graph'], ['wiki/index.md', 'Wiki'], ['@search', 'Search']];
const filesByPath = Object.fromEntries(DATA.files.map(f => [f.path, f]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = 'README.md', mermaidSeq = 0;
if (window.mermaid) mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'default', flowchart: {htmlLabels: true, useMaxWidth: false, wrappingWidth: 320}});

function tabs() {
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  for (const [id, label] of TABS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === current || (id === 'wiki/index.md' && current.startsWith('wiki/')));
    b.onclick = () => show(id); nav.append(b);
  }
}
// a link written inside wiki/…/page.md is relative to that page; the viewer sits at the pack root
function resolveHref(href) {
  if (/^[a-z][a-z0-9+.-]*:|^#|^\//i.test(href) || current.startsWith('@') || !current.includes('/')) return href;
  const [path, frag] = href.split('#');
  const parts = current.split('/').slice(0, -1);
  for (const seg of path.split('/')) {
    if (seg === '..') { if (parts.length && parts[parts.length - 1] !== '..') parts.pop(); else parts.push('..'); }
    else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/') + (path.endsWith('/') ? '/' : '') + (frag ? '#' + frag : '');
}
function md(text) {
  if (!window.marked) return '<pre>' + esc(text) + '</pre>';
  const raw = marked.parse(text, {gfm: true});
  return window.DOMPurify ? DOMPurify.sanitize(raw, {ADD_ATTR: ['target']}) : '<pre>' + esc(text) + '</pre>';
}
async function show(id, anchor) {
  current = id; tabs();
  const page = document.getElementById('page');
  if (id === '@search') { searchPage(document.getElementById('q').value); return; }
  if (id === '@graph') { graphPage(); return; }
  page.innerHTML = md((DATA.pages[id] || '').replace(/^---\n[\s\S]*?\n---\n/, ''));
  wireLinks(page);
  if (id === 'USERS.md') userBar(page);
  await drawDiagrams(page);
  if (anchor) document.getElementById(anchor)?.scrollIntoView(); else window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function wireLinks(root) {
  root.querySelectorAll('h2,h3').forEach(h => { if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}_]+/gu, '-'); });
  root.querySelectorAll('a[href]').forEach(a => {
    const raw = a.getAttribute('href');
    if (raw.startsWith('#')) return;
    const href = resolveHref(raw);
    if (href !== raw) a.setAttribute('href', href);
    const target = href.split('#')[0];
    if (DATA.pages[target]) { a.onclick = e => { e.preventDefault(); show(target); }; return; }
    const path = toProjectPath(href);
    if (path && filesByPath[path]) {
      a.onclick = e => { if (e.ctrlKey || e.metaKey) return; e.preventDefault(); openCard(path, lineOf(href)); };
    } else { a.target = '_blank'; a.rel = 'noopener'; }
  });
}
// Picking a user type brings its flow forward. Nothing is removed: the other flows stay on the
// page, dimmed, and come back on hover, because a successor has to follow work across user types.
let focusUser = '';
function userBar(page) {
  const users = DATA.users || []; if (users.length < 2) return;
  const bar = document.createElement('div'); bar.className = 'ubar';
  bar.innerHTML = '<span>Bring forward:</span>';
  const mk = (name, label) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', focusUser === name); b.onclick = () => { focusUser = name; markUser(page); bar.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }; bar.append(b); };
  mk('', 'All user types'); for (const u of users) mk(u, u);
  const first = page.querySelector('h2'); (first || page.firstChild).before(bar);
  markUser(page);
}
function markUser(page) {
  const users = new Set(DATA.users || []);
  page.querySelectorAll('.ud,.uf').forEach(el => el.classList.remove('ud', 'uf'));
  if (!focusUser) return;
  let state = '';                                   // '' outside a user section, 'f' inside the chosen one, 'd' inside another
  for (const el of page.children) {
    if (el.tagName === 'H2') { state = ''; continue; }
    if (el.tagName === 'H3') {
      const name = el.querySelector('code')?.textContent.trim();
      state = users.has(name) ? (name === focusUser ? 'f' : 'd') : '';
      if (state) el.classList.add(state === 'f' ? 'uf' : 'ud');
      continue;
    }
    if (state === 'd') { el.classList.add('ud'); continue; }
    if (el.tagName !== 'TABLE') continue;
    for (const tr of el.querySelectorAll('tbody tr')) {
      const named = [...tr.querySelectorAll('code')].map(c => c.textContent.trim()).filter(x => users.has(x));
      if (named.includes(focusUser)) tr.classList.add('uf'); else if (named.length && state !== 'f') tr.classList.add('ud');
    }
  }
}
function lineOf(href) { const m = href.match(/#L(\d+)$/); return m ? +m[1] : 0; }
function toProjectPath(href) {
  let h = decodeURIComponent(href.split('#')[0]);
  if (DATA.linkBase && h.startsWith(DATA.linkBase)) return h.slice(DATA.linkBase.length);
  if (DATA.relPrefix && h.startsWith(DATA.relPrefix)) return h.slice(DATA.relPrefix.length);
  return filesByPath[h] ? h : null;
}
async function drawDiagrams(root) {
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')];
  for (const code of blocks) {
    const src = code.textContent;
    const diagram = Object.values(DATA.diagrams).find(d => d.source.trim() === src.trim());
    const box = document.createElement('div'); box.className = 'diagram';
    const tools = document.createElement('div'); tools.className = 'tools';
    let zoom = 1;
    const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; tools.append(b); };
    const canvas = document.createElement('div');
    const fit = () => { const svg = canvas.querySelector('svg'); if (!svg) return;
      zoom = Math.min(1, (box.clientWidth - 26) / (svg.getBoundingClientRect().width / zoom)); canvas.style.zoom = zoom; };
    mk('−', () => { zoom = Math.max(.2, zoom - .15); canvas.style.zoom = zoom; });
    mk('+', () => { zoom = Math.min(3, zoom + .15); canvas.style.zoom = zoom; });
    mk('Fit', fit);
    mk('1:1', () => { zoom = 1; canvas.style.zoom = 1; });
    box.append(tools, canvas);
    code.parentElement.replaceWith(box);
    if (!window.mermaid) { canvas.innerHTML = '<pre>' + esc(src) + '</pre>'; continue; }
    try {
      const {svg} = await mermaid.render('hf' + (++mermaidSeq), src);
      canvas.innerHTML = svg;
      fit();
      if (diagram) canvas.querySelectorAll('g.node').forEach(g => {
        const m = (g.id || '').match(/flowchart-(n\d+)-/); const path = m && diagram.files[m[1]];
        if (path && filesByPath[path]) { g.addEventListener('click', () => openCard(path)); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); }
      });
    } catch (e) { canvas.innerHTML = '<pre>' + esc(src) + '\n\n' + esc(e.message || e) + '</pre>'; }
  }
}
function link(path, line, label) {
  const f = filesByPath[path];
  return f ? `<a href="#" data-path="${esc(path)}" data-line="${line || 0}">${esc(label || path)}</a>` : esc(label || path);
}
function openCard(path, line) {
  const f = filesByPath[path]; if (!f) return;
  let h = `<h2>${esc(f.path)}${line ? ' <span class="muted">:' + line + '</span>' : ''}</h2>`;
  h += `<div><span class="chip">${esc(f.lang)}</span><span class="chip">${f.lines} lines</span><span class="chip">${esc(f.category)}</span>${f.tags.filter(t => !t.startsWith('ns:')).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  if (f.source_url) h += `<p><a href="${esc(f.source_url)}${line ? '#L' + line : ''}" target="_blank" rel="noopener">Open source ↗</a></p>`;
  if (G.byId['file:' + f.path]) h += `<p><button class="act" type="button" data-rel="1">Relations and wiki page</button></p>`;
  if (f.note) h += `<h3>Notes</h3><div class="note">${esc(f.note)}</div>`;
  if (f.model) h += `<h3>Summary</h3>${modelBlock(f.model)}`;
  if (f.summary) h += `<h3>Comment</h3><p>${esc(f.summary)} <span class="muted">(${esc(f.summary_source)})</span></p>`;
  if (f.translated) h += `<p class="muted">${f.translated} heading(s) or comment(s) here are English versions from the notes file; the originals are in handoff.json.</p>`;
  if (f.symbols.length) h += `<h3>Symbols</h3><ul class="list">` + f.symbols.slice(0, 60).map(s => `<li><code>${esc((s.parent && s.kind === 'method' ? s.parent + '.' : '') + s.name)}</code> <span class="muted">${esc(s.kind)} · L${s.line}</span>${s.doc ? '<br>' + esc(s.doc) : ''}</li>`).join('') + '</ul>';

  const termHtml = terms.length ? `<h2>Words on the screens</h2><p class="muted">${terms.length} found. What a user reads, where it is, and the feature it leads to.</p>` +
    terms.slice(0, 120).map((t, i) => `<div class="filehit" data-term="${i}"><strong>${esc(t.text)}</strong>${t.alt.map(a => ' / ' + esc(a)).join('')} <span class="chip">${esc(t.kind)}</span>${t.seen.map(u => `<span class="chip">${esc(u)}</span>`).join('')}<br><span class="muted">${esc(t.file)}:${t.line}${t.when ? ' · shown when ' + esc(t.when) : ''}${t.leads.length ? ' · leads to ' + esc(t.leads.map(l => l.id).join(', ')) : ''}</span></div>`).join('') + '<h2>Files</h2>' : '';
  page.innerHTML = `<h1>Search</h1>` + termHtml + `<p class="muted">${hits.length} / ${DATA.files.length}</p>` +
    hits.slice(0, 300).map(f => `<div class="filehit" data-path="${esc(f.path)}"><strong>${esc(f.path)}</strong> <span class="chip">${esc(f.lang)}</span><br><span class="muted">${esc(f.note || f.summary || (f.model ? '(model) ' + f.model.summary : ''))}</span></div>`).join('');
  page.querySelectorAll('.filehit[data-path]').forEach(el => el.onclick = () => openCard(el.dataset.path));
  page.querySelectorAll('.filehit[data-term]').forEach(el => el.onclick = () => {
    const t = terms[+el.dataset.term], lead = t.leads.find(l => l.page && DATA.pages[l.page]);
    if (lead) show(lead.page); else openCard(t.file, t.line);
  });
}
document.getElementById('q').addEventListener('input', e => searchPage(e.target.value));
const start = decodeURIComponent(location.hash.slice(1));
show(DATA.pages[start] || start === '@graph' ? start : 'README.md');
</script>
</body>
</html>
