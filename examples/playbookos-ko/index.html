<script id="data" type="application/json">{"lang": "ko", "pages": {"README.md": "# 인수인계: PlayBookOS\n\n<sub>HandOff247 0.1.0이 2026-11-09에 https://github.com/unkkyuist/PlayBookOS@7153e47 기준으로 생성했습니다. 이 페이지를 직접 고치지 말고 노트 파일을 고친 뒤 다시 생성하세요.<\/sub>\n\n\n> 읽는 법: '노트' 표시가 없는 내용은 모두 코드에서 찾은 것이며 근거 줄로 연결됩니다. 노트는 사람이 `examples/playbookos.notes.ko.md`에 쓴 설명입니다. 점선 화살표는 추론이므로 믿기 전에 확인하세요.\n\n## 한눈에 보기\n\n| 파일 | 줄 | 언어 | 실행 모드 | operation | HTTP 라우트 | MCP 도구 | 환경변수 |\n|---|---|---|---|---|---|---|---|\n| 97 | 9,665 | 8 | 6 | 65 | 6 | 46 | 8 |\n\nPython 20 (3,559 줄) · C# 18 (2,740 줄) · JavaScript 11 (1,283 줄) · PowerShell 7 (194 줄) · Batch 5 (17 줄) · HTML 2 (41 줄) · Shell 1 (9 줄) · CSS 1 (47 줄)\n\n\n## 이 프로젝트는\n\n> **노트**\n>\n> PlayBook OS는 프로젝트·레퍼런스·AI 작업을 함께 기록하는 공통 원장입니다. 웹 화면, JSON CLI, MCP(stdio/HTTP)가 모두 같은 operation과 같은 SQLite DB를 씁니다 (README.md).\n> 사용자별 권한이나 테넌트 분리가 없는, 소유자가 신뢰하는 작업 공간용 서비스입니다 (README.en.md \"Verification and scope\").\n\n\n[README.en.md](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/README.en.md)에서 발췌: *Manage projects, shared references and AI work through one revisioned ledger.*\n\n\n## 전체 구조도\n\n실행 스크립트가 프로그램을 띄우고, 모드마다 열리는 인터페이스가 다릅니다. 호출은 모두 분기표(dispatch table)로 모이고, 분기표가 처리 파일로 일을 넘깁니다.\n\n```mermaid\nflowchart LR\n  n1[\"실행 스크립트 ×9<br/>START#95;PLAYBOOK.cmd, playbook-harness.ps1, playbook.ps1 …\"]:::launcher\n  n2[[\"PlayBook (PlayBook.csproj)\"]]:::entry\n  n1 -->|\"실행\"| n2\n  subgraph g3[\"Program.cs 실행 모드\"]\n    n4([\"worker\"]):::mode\n    n5([\"cli\"]):::mode\n    n6([\"mcp\"]):::mode\n    n7([\"agent\"]):::mode\n    n8([\"serve (기본값)\"]):::mode\n    n9([\"server\"]):::mode\n  end\n  n2 --> n4\n  n2 --> n5\n  n2 --> n6\n  n2 --> n7\n  n2 --> n8\n  n2 --> n9\n  n10{{\"Operations.Execute · 65 개 operation\"}}:::table\n  n11[/\"HTTP 라우트 5개\"/]:::iface\n  n8 --> n11\n  n9 --> n11\n  n12[/\"MCP HTTP /mcp\"/]:::iface\n  n8 --> n12\n  n9 --> n12\n  n11 -->|\"POST /api/{operation}\"| n10\n  n13[[\"MCP 도구 46개 468b6c14/playbook-harness.ps1) — **사람이 실행하는 스크립트**\n6. [Domain.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Domain.cs) — **17개 파일이 쓰는 공통 기반**\n7. [Store.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Store.cs) — **12개 파일이 쓰는 공통 기반**\n8. [wwwroot/i18n.js](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/wwwroot/i18n.js) — **10개 파일이 쓰는 공통 기반**\n9. [McpTools.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/McpTools.cs) — **MCP 도구 정의**\n10. [Ontology.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Ontology.cs) — **operation 8개 처리**\n11. [Workspace.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Workspace.cs) — **operation 7개 처리**\n12. [Orchestration.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Orchestration.cs) — **operation 7개 처리**\n\n## 후임자 체크리스트\n\n> **노트**\n>\n> 1. .NET 10 SDK를 설치하고 `dotnet build -c Release` 뒤 `.\\playbook.ps1 serve`로 띄운 다음 http://127.0.0.1:7331 을 엽니다.\n> 2. GUI·CLI·MCP 모두 같은 `PLAYBOOK_HOME`을 가리켜야 합니다. 다르면 각자 다른 DB를 봅니다.\n> 3. 비즈니스 로직을 바꾸면 `python scripts/smoke.py`를 돌립니다 (릴리스 전에는 folders·ontology·central 스모크도).\n> 4. 이 프로젝트의 작업은 PlayBook 안의 프로젝트 ID `playbook`으로 기록합니다 (AGENTS.md).\n\n## 알려진 문제와 위험\n\n> **노트**\n>\n> - 모든 변경은 `expectedRevision`을 보내야 합니다. 충돌하면 무작정 다시 보내지 말고 최신 기록을 읽어 합칩니다 (README.md).\n> - macOS 실행은 검증되지 않았습니다. 크로스 빌드만으로는 근거가 되지 않습니다 (AGENTS.md).\n> - v0.2.0에서 Claude 실제 모델 실행은 검증되지 않았습니다. docs/RELEASE-0.2.0.md를 보세요.\n\n## 인증 정보와 계정\n\n> **노트**\n>\n> HTTP·MCP 키는 `PLAYBOOK_HOME/api-key`에 있습니다 (`serve`를 처음 실행할 때 만들어짐). `data/`, 도구 인증 정보, 로그, API 키는 커밋하지 않습니다 (AGENTS.md).\n\n## 아직 설명이 없는 곳\n\n`examples/playbookos.notes.ko.md`에 적어 주세요 (`handoff247 notes`를 실행하면 제목이 추가됩니다).\n\n- [Program.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs)\n- [START_PLAYBOOK.cmd](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/START_PLAYBOOK.cmd)\n- [playbook-harness.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook-harness.ps1)\n- [Domain.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Domain.cs)\n- [wwwroot/i18n.js](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/wwwroot/i18n.js)\n- [McpTools.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/McpTools.cs)\n- [Ontology.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Ontology.cs)\n- [Workspace.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Workspace.cs)\n- [Orchestration.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Orchestration.cs)\n- [Harnesses.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Harnesses.cs)\n- [START_GRAPHIFY.cmd](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/START_GRAPHIFY.cmd)\n- [Start-PlayBook-Desktop.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Start-PlayBook-Desktop.ps1)\n- [graphify.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/graphify.ps1)\n- [playbook.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook.ps1)\n- [playbook.sh](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook.sh)\n- [portable/INSTALL_PLAYBOOK.cmd](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/INSTALL_PLAYBOOK.cmd)\n- [portable/Install-PlayBook.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/Install-PlayBook.ps1)\n- [portable/START_PLAYBOOK.cmd](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/START_PLAYBOOK.cmd)\n- [portable/STOP_PLAYBOOK.cmd](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/STOP_PLAYBOOK.cmd)\n- [portable/Start-PlayBook.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/Start-PlayBook.ps1)\n\n## 최근 커밋\n\n- `7153e47` 2026-11-07 — Add project flowchart panel, curated Graphify specs and desktop launcher\n- `f0a2812` 2026-10-29 — Add reviewed AI guidance workflow with paired trials\n- `7813ce7` 2026-10-18 — Add reliable MCP audit logs and Oz support bundles\n- `ca98380` 2026-10-18 — Add Graphify integration and Oz macOS Claude Code distribution\n- `ec10b93` 2026-10-07 — Release PlayBook OS 0.2.0 with portable workspace and AI orchestration\n\n", "RUNNING.md": "# 실행 방법과 실행 구조\n\n<sub>HandOff247 0.1.0이 2026-11-09에 https://github.com/unkkyuist/PlayBookOS@7153e47 기준으로 생성했습니다. 이 페이지를 직접 고치지 말고 노트 파일을 고친 뒤 다시 생성하세요.<\/sub>\n\n[← 처음으로](README.md)\n\n\n## 실행 순서\n\n누가 누구를 실행하는지. 화살표 글자는 그 줄에서 넘기는 인자입니다.\n\n```mermaid\nflowchart LR\n  n1[\"START#95;GRAPHIFY.cmd\"]:::launcher\n  n2[\"graphify.ps1\"]:::launcher\n  n1 -->|\"start\"| n2\n  n3[\"START#95;PLAYBOOK.cmd\"]:::launcher\n  n4[\"playbook.ps1\"]:::launcher\n  n3 -->|\"serve\"| n4\n  n5[\"Start-PlayBook-Desktop.ps1\"]:::launcher\n  n6[[\"PlayBook (PlayBook.csproj)\"]]:::entry\n  n5 --> n6\n  n7[\"MCP 클라이언트 설정: codex-mcp.toml\"]:::ext\n  n7 -->|\"mcp\"| n6\n  n8[\"MCP 클라이언트 설정: mcp.json\"]:::ext\n  n8 -->|\"mcp\"| n6\n  n9[\"scripts/graphify-playbook.py\"]:::file\n  n2 --> n9\n  n10[\"playbook-harness.ps1\"]:::launcher\n  n10 --> n6\n  n4 --> n6\n  n11[\"playbook.sh\"]:::launcher\n  n11 --> n6\n  n12[\"portable/INSTALL#95;PLAYBOOK.cmd\"]:::launcher\n  n13[\"portable/Install-PlayBook.ps1\"]:::launcher\n  n12 --> n13\n  n13 --> n6\n  n14[\"portable/Start-PlayBook.ps1\"]:::launcher\n  n13 --> n14\n  n15[\"portable/START#95;PLAYBOOK.cmd\"]:::launcher\n  n15 --> n14\n  n16[\"portable/STOP#95;PLAYBOOK.cmd\"]:::launcher\n  n17[\"portable/Stop-PlayBook.ps1\"]:::launcher\n  n16 --> n17\n  n14 --> n6\n  n18[\"scripts/check-package.py\"]:::file\n  n18 --> n6\n  n9 --> n6\n  n19([\"worker\"]):::mode\n  n6 --> n19\n  n20([\"cli\"]):::mode\n  n6 --> n20\n  n21([\"mcp\"]):::mode\n  n6 --> n21\n  n22([\"agent\"]):::mode\n  n6 --> n22\n  n23([\"serve (기본값)\"]):::mode\n  n6 --> n23\n  n24([\"server\"]):::mode\n  n6 --> n24\n  n25>\"http://127.0.0.1:7334/?projectId=playbook\"]:::ext\n  n1 -.->|\"열기\"| n25\n  n26[\"테스트·스모크 스크립트 7개\"]:::test\n  n26 -.->|\"cli, serve, mcp\"| n6\n  classDef entry fill:#fde68a,stroke:#b45309,color:#1f2937\n  classDef launcher fill:#e0e7ff,stroke:#4338ca,color:#1f2937\n  classDef mode fill:#dcfce7,stroke:#15803d,color:#1f2937\n  classDef iface fill:#cffafe,stroke:#0e7490,color:#1f2937\n  classDef table fill:#fce7f3,stroke:#be185d,color:#1f2937\n  classDef hub fill:#f3f4f6,stroke:#6b7280,color:#1f2937,stroke-dasharray:4 3\n  classDef data fill:#fef3c7,stroke:#92400e,color:#1f2937\n  classDef ext fill:#ffffff,stroke:#9ca3af,color:#374151,stroke-dasharray:2 2\n  classDef test fill:#ede9fe,stroke:#6d28d9,color:#1f2937\n  classDef file fill:#ffffff,stroke:#64748b,color:#1f2937\n```\n\n<sub>Mermaid 원문: diagrams/startup.mmd<\/sub>\n\n\n## 실행 모드\n\n[Program.cs](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs)은 첫 번째 인자(`mode`)로 모드를 고릅니다.\n\n| 모드 | 위치 | 사용 | 여는 것 | 노트 |\n|---|---|---|---|---|\n| `worker` | [Program.cs:19–19](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L19) | ToolRunner |  |  |\n| `cli` | [Program.cs:20–32](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L20) | Json, Operations | → Operations.Execute | 프로세스 하나에 operation 하나: `PlayBook.dll cli <operation> <JSON \\| @파일 \\| ->`. 오류는 stderr에 JSON으로 나오고 종료 코드는 1입니다. |\n| `mcp` | [Program.cs:33–40](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L33) | McpTools | MCP over stdio |  |\n| `agent` | [Program.cs:41–48](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L41) | AgentWorker, Connection, Operations | background service |  |\n| `serve` (기본값) | [Program.cs:49–112](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L49) | Access, AgentWorker, Connection, DomainError, Json, Library … 외 4개 | MCP over HTTP, HTTP server, background service, HTTP 라우트 6개, → Operations.Execute | 평소에 쓰는 모드입니다. 웹 화면, `/api/{operation}`, `/mcp`의 HTTP MCP, 로컬 AI 워커가 함께 뜹니다. |\n| `server` | [Program.cs:49–112](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Program.cs#L49) | Access, AgentWorker, Connection, DomainError, Json, Library … 외 4개 | MCP over HTTP, HTTP server, background service, HTTP 라우트 6개, → Operations.Execute | 여러 PC가 함께 쓰는 중앙 서버입니다. 별도의 `PLAYBOOK_HOME`이 필요하고, 먼저 `cli server.setup`으로 계정을 만들어야 합니다. |\n\n\n## 실행 명령\n\n| 위치 | 명령 | 실행 |\n|---|---|---|\n| [START_GRAPHIFY.cmd:3](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/START_GRAPHIFY.cmd#L3) | `powershell -NoProfile -ExecutionPolicy Bypass -File \"%~dp0graphify.ps1\" start` | [graphify.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/graphify.ps1) → `start` |\n| [START_GRAPHIFY.cmd:5](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/START_GRAPHIFY.cmd#L5) | `start \"\" \"http://127.0.0.1:7334/?projectId=playbook\"` |  |\n| [START_PLAYBOOK.cmd:3](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/START_PLAYBOOK.cmd#L3) | `powershell -NoProfile -ExecutionPolicy Bypass -File \"%~dp0playbook.ps1\" serve` | [playbook.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook.ps1) → `serve` |\n| [Start-PlayBook-Desktop.ps1:34](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/Start-PlayBook-Desktop.ps1#L34) | `Start-Process $url }` |  |\n| [graphify.ps1:5](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/graphify.ps1#L5) | `python (Join-Path $PSScriptRoot 'scripts\\graphify-playbook.py') @Arguments` | [scripts/graphify-playbook.py](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/scripts/graphify-playbook.py) |\n| [playbook-harness.ps1:12](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook-harness.ps1#L12) | `dotnet $harnessDll @Arguments` |  |\n| [playbook.ps1:10](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook.ps1#L10) | `dotnet $appDll @Arguments` |  |\n| [playbook.sh:9](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/playbook.sh#L9) | `exec dotnet \"$root/bin/Release/net10.0/PlayBook.dll\" \"$@\"` | [PlayBook.csproj](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/PlayBook.csproj) |\n| [portable/INSTALL_PLAYBOOK.cmd:2](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/INSTALL_PLAYBOOK.cmd#L2) | `powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File \"%~dp0Install-PlayBook.ps1\" %*` | [portable/Install-PlayBook.ps1](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/Install-PlayBook.ps1) |\n| [portable/Install-PlayBook.ps1:67](https://github.com/unkkyuist/PlayBookOS/blob/7153e47ec28a0b1933c24404db08a43a468b6c14/portable/Install-PlayBook.ps1#L67) | `& $exe cli connection.configure ('@' + $requestPath)` |  |\n| [portable/Instal <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ko = DATA.lang === 'ko';
const TABS = [['README.md', ko ? '개요' : 'Overview'], ['RUNNING.md', ko ? '실행' : 'Running'],
  ['CONNECTIONS.md', ko ? '연결' : 'Connections'], ['CODEMAP.md', ko ? '코드 지도' : 'Code map'],
  ['FILES.md', ko ? '파일' : 'Files'], ['@search', ko ? '찾기' : 'Search']];
const filesByPath = Object.fromEntries(DATA.files.map(f => [f.path, f]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = 'README.md', mermaidSeq = 0;
if (window.mermaid) mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'default', flowchart: {htmlLabels: true, useMaxWidth: false, wrappingWidth: 320}});

function tabs() {
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  for (const [id, label] of TABS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === current); b.onclick = () => show(id); nav.append(b);
  }
}
function md(text) {
  if (!window.marked) return '<pre>' + esc(text) + '</pre>';
  const raw = marked.parse(text, {gfm: true});
  return window.DOMPurify ? DOMPurify.sanitize(raw, {ADD_ATTR: ['target']}) : '<pre>' + esc(text) + '</pre>';
}
async function show(id, anchor) {
  current = id; tabs();
  const page = document.getElementById('page');
  if (id === '@search') { searchPage(document.getElementById('q').value); return; }
  page.innerHTML = md(DATA.pages[id] || '');
  wireLinks(page);
  await drawDiagrams(page);
  if (anchor) document.getElementById(anchor)?.scrollIntoView(); else window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function wireLinks(root) {
  root.querySelectorAll('h2,h3').forEach(h => { if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/[^\w가-힣]+/g, '-'); });
  root.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (DATA.pages[href]) { a.onclick = e => { e.preventDefault(); show(href); }; return; }
    if (href.startsWith('#')) return;
    const path = toProjectPath(href);
    if (path && filesByPath[path]) {
      a.onclick = e => { if (e.ctrlKey || e.metaKey) return; e.preventDefault(); openCard(path, lineOf(href)); };
    } else { a.target = '_blank'; a.rel = 'noopener'; }
  });
}
function lineOf(href) { const m = href.match(/#L(\d+)$/); return m ? +m[1] : 0; }
function toProjectPath(href) {
  let h = decodeURIComponent(href.split('#')[0]);
  if (DATA.linkBase && h.startsWith(DATA.linkBase)) return h.slice(DATA.linkBase.length);
  if (DATA.relPrefix && h.startsWith(DATA.relPrefix)) return h.slice(DATA.relPrefix.length);
  return filesByPath[h] ? h : null;
}
async function drawDiagrams(root) {
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')];
  for (const code of blocks) {
    const src = code.textContent;
    const diagram = Object.values(DATA.diagrams).find(d => d.source.trim() === src.trim());
    const box = document.createElement('div'); box.className = 'diagram';
    const tools = document.createElement('div'); tools.className = 'tools';
    let zoom = 1;
    const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; tools.append(b); };
    const canvas = document.createElement('div');
    const fit = () => { const svg = canvas.querySelector('svg'); if (!svg) return;
      zoom = Math.min(1, (box.clientWidth - 26) / (svg.getBoundingClientRect().width / zoom)); canvas.style.zoom = zoom; };
    mk('−', () => { zoom = Math.max(.2, zoom - .15); canvas.style.zoom = zoom; });
    mk('+', () => { zoom = Math.min(3, zoom + .15); canvas.style.zoom = zoom; });
    mk(ko ? '맞춤' : 'Fit', fit);
    mk('1:1', () => { zoom = 1; canvas.style.zoom = 1; });
    box.append(tools, canvas);
    code.parentElement.replaceWith(box);
    if (!window.mermaid) { canvas.innerHTML = '<pre>' + esc(src) + '</pre>'; continue; }
    try {
      const {svg} = await mermaid.render('hf' + (++mermaidSeq), src);
      canvas.innerHTML = svg;
      fit();
      if (diagram) canvas.querySelectorAll('g.node').forEach(g => {
        const m = (g.id || '').match(/flowchart-(n\d+)-/); const path = m && diagram.files[m[1]];
        if (path && filesByPath[path]) { g.addEventListener('click', () => openCard(path)); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); }
      });
    } catch (e) { canvas.innerHTML = '<pre>' + esc(src) + '\n\n' + esc(e.message || e) + '</pre>'; }
  }
}
function link(path, line, label) {
  const f = filesByPath[path];
  return f ? `<a href="#" data-path="${esc(path)}" data-line="${line || 0}">${esc(label || path)}</a>` : esc(label || path);
}
function openCard(path, line) {
  const f = filesByPath[path]; if (!f) return;
  const L = s => ko ? s[1] : s[0];
  let h = `<h2>${esc(f.path)}${line ? ' <span class="muted">:' + line + '</span>' : ''}</h2>`;
  h += `<div><span class="chip">${esc(f.lang)}</span><span class="chip">${f.lines} ${L(['lines','줄'])}</span><span class="chip">${esc(f.category)}</span>${f.tags.filter(t => !t.startsWith('ns:')).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  if (f.source_url) h += `<p><a href="${esc(f.source_url)}${line ? '#L' + line : ''}" target="_blank" rel="noopener">${L(['Open source ↗','원본 열기 ↗'])}</a></p>`;
  if (f.note) h += `<h3>${L(['Notes','노트'])}</h3><div class="note">${esc(f.note)}</div>`;
  if (f.summary) h += `<h3>${L(['Comment','주석'])}</h3><p>${esc(f.summary)} <span class="muted">(${esc(f.summary_source)})</span></p>`;
  if (f.symbols.length) h += `<h3>${L(['Symbols','심볼'])}</h3><ul class="list">` + f.symbols.slice(0, 60).map(s => `<li><code>${esc((s.parent && s.kind === 'method' ? s.parent + '.' : '') + s.name)}</code> <span class="muted">${esc(s.kind)} · L${s.line}</span>${s.doc ? '<br>' + esc(s.doc) : ''}</li>`).join('') + '</ul>';
  for (const [title, list, arrow] of [[L(['Links out','나가는 연결']), f.out, '→'], [L(['Links in','들어오는 연결']), f.in, '←']]) {
    if (!list.length) continue;
    h += `<h3>${title}</h3><ul class="list">` + list.map(e => `<li><span class="chip">${esc(e.kind)}</span>${arrow} ${link(e.other, 0, e.other)}${e.label ? ' <span class="muted">' + esc(e.label) + '</span>' : ''}</li>`).join('') + '</ul>';
  }
  const card = document.getElementById('card'); card.innerHTML = h;
  card.querySelectorAll('a[data-path]').forEach(a => a.onclick = e => { e.preventDefault(); openCard(a.dataset.path, +a.dataset.line); });
  const d = document.getElementById('drawer'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); d.scrollTop = 0;
}
function closeDrawer() { const d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
function searchPage(q) {
  current = '@search'; tabs();
  const page = document.getElementById('page');
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = DATA.files.filter(f => {
    const hay = (f.path + ' ' + f.summary + ' ' + f.note + ' ' + f.symbols.map(s => s.name + ' ' + s.doc).join(' ')).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  page.innerHTML = `<h1>${ko ? '찾기' : 'Search'}</h1><p class="muted">${hits.length} / ${DATA.files.length}</p>` +
    hits.slice(0, 300).map(f => `<div class="filehit" data-path="${esc(f.path)}"><strong>${esc(f.path)}</strong> <span class="chip">${esc(f.lang)}</span><br><span class="muted">${esc(f.note || f.summary || '')}</span></div>`).join('');
  page.querySelectorAll('.filehit').forEach(el => el.onclick = () => openCard(el.dataset.path));
}
document.getElementById('q').addEventListener('input', e => searchPage(e.target.value));
const start = decodeURIComponent(location.hash.slice(1));
show(DATA.pages[start] ? start : 'README.md');
</script>
</body>
