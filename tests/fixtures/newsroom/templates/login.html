{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="{{ url_for('login') }}">
  <label for="email">Work e-mail</label>
  <input id="email" name="email" type="email">
  <button type="submit">Continue</button>
</form>
{% endblock %}
