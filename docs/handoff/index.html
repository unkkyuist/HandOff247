<script id="data" type="application/json">{"pages": {"README.md": "# Handoff: HandOff247\n\n<sub>Generated by HandOff247 0.5.0 from https://github.com/unkkyuist/HandOff247@ffbe44f on 2026-11-10. Re-run to refresh; edit the notes file, not this page.<\/sub>\n\n\n> How to read this pack: everything without a 'Notes' label was found in the code and links to the line it came from. Notes were written by a person in `HANDOFF.notes.md`. Dashed arrows are inferences — check them before relying on them.\n\n> Handover status: **13 of 13** checks ready — see [HANDOVER.md](HANDOVER.md).\n\n## At a glance\n\n| files | lines | languages | operations |\n|---|---|---|---|\n| 36 | 8,426 | 1 | 24 |\n\nPython 28 (7,753 lines)\n\n\n## What this project is\n\n> **Notes**\n>\n> HandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\n> Status: v0.5.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. Since v0.4.0 every pack also holds the ontology (`ontology.json`), a graph of it in the viewer, and a wiki for AI assistants (`wiki/`, `llms.txt`). v0.5.0 adds optional file summaries written through the signed-in Codex CLI (`--summarize`) and an MCP server (`handoff247 mcp`) through which an AI agent reads the project and writes notes. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n\nFrom [README.md](../../README.md): *Hand Off 24-7 is a good-bye project for passing your existing projects to the next person.*\n\n\n## System map\n\nLaunch scripts start the program; each mode exposes interfaces; every caller ends up in the dispatch table, which hands work to the handler files.\n\n```mermaid\nflowchart LR\n  n1{{\"handoff247/analyzers/#95;#95;init#95;#95;.py:7 · 17 ops\"}}:::table\n  n2{{\"handoff247/leaving.py:257 · 3 ops\"}}:::table\n  n3{{\"handoff247/mcp.py:250 · 4 ops\"}}:::table\n  subgraph g4[\"Handlers\"]\n    n5[\"docs.py\"]:::file\n    n6[\"web.py\"]:::file\n    n7[\"shell.py\"]:::file\n    n8[\"csharp.py\"]:::file\n    n9[\"python.py\"]:::file\n  end\n  n1 -->|\"csharp\"| n8\n  n1 -->|\"python\"| n9\n  n1 -->|\"css, html, javascript … (4)\"| n6\n  n1 -->|\"batch, powershell, shell\"| n7\n  n1 -->|\"dockerfile, json, markdown … (8)\"| n5\n  classDef entry fill:#fde68a,stroke:#b45309,color:#1f2937\n  classDef launcher fill:#e0e7ff,stroke:#4338ca,color:#1f2937\n  classDef mode fill:#dcfce7,stroke:#15803d,color:#1f2937\n  classDef iface fill:#cffafe,stroke:#0e7490,color:#1f2937\n  classDef table fill:#fce7f3,stroke:#be185d,color:#1f2937\n  classDef hub fill:#f3f4f6,stroke:#6b7280,color:#1f2937,stroke-dasharray:4 3\n  classDef data fill:#fef3c7,stroke:#92400e,color:#1f2937\n  classDef ext fill:#ffffff,stroke:#9ca3af,color:#374151,stroke-dasharray:2 2\n  classDef test fill:#ede9fe,stroke:#6d28d9,color:#1f2937\n  classDef file fill:#ffffff,stroke:#64748b,color:#1f2937\n```\n\n<sub>Mermaid source: diagrams/system.mmd<\/sub>\n\n\n## Pages\n\n- [HANDOVER.md](HANDOVER.md) — Handover checklist — what is ready, unfinished work, what exists only on one computer, accounts, people\n- [RUNNING.md](RUNNING.md) — How it runs — launch chain, modes, environment variables, ports, build and tests\n- [CONNECTIONS.md](CONNECTIONS.md) — How the tools connect — operations, HTTP routes, MCP tools, callers\n- [CODEMAP.md](CODEMAP.md) — Code map — which file depends on which\n- [FILES.md](FILES.md) — File cards — one card per file with comments, symbols and links\n- [index.html](index.html) — Interactive viewer with a graph of everything found (open index.html in a browser)\n- [wiki/index.md](wiki/index.md) — Wiki for AI assistants — one small page per file, operation, tool and run mode, all interlinked\n- [llms.txt](llms.txt) — Entry point for AI assistants (llms.txt convention); llms-full.txt is the whole wiki in one file\n- [ontology.json](ontology.json) — The ontology as data — every entity and relation, with the file and line it was observed at\n\n## Suggested reading order\n\n1. [README.md](../../README.md) — **what the project says about itself**\n2. [handoff247/analyzers/__init__.py](../../handoff247/analyzers/__init__.py) — **dispatch table: 17 operations** — Per-language analyzers.\n3. [handoff247/leaving.py](../../handoff247/leaving.py) — **dispatch table: 3 operations** — What the code alone cannot hand over: unfinished work, things that exist only on the computer the pack was generated on, accounts and services, tools to install, people.\n4. [handoff247/mcp.py](../../handoff247/mcp.py) — **dispatch table: 4 operations** — MCP server (stdio, JSON-RPC 2.0, one message per line) so an AI agent can work on a handoff: build the pack, see what is still undocumented, read the ontology and the source, and write notes under the right heading.\n5. [handoff247/model.py](../../handoff247/model.py) — **shared foundation used by 17 files** — Data model shared by every analyzer and renderer.\n6. [handoff247/analyzers/docs.py](../../handoff247/analyzers/docs.py) — **handles 8 operations** — Markdown/text documents and configuration files (MSBuild, package.json, pyproject, requirements, MCP client configs, Dockerfile, GitHub workflows).\n7. [handoff247/analyzers/web.py](../../handoff247/analyzers/web.py) — **handles 4 operations** — JavaScript/TypeScript, HTML and CSS analyzers.\n8. [handoff247/analyzers/shell.py](../../handoff247/analyzers/shell.py) — **handles 3 operations** — PowerShell, POSIX shell and Windows batch analyzers (line based, no execution).\n9. [handoff247/analyzers/csharp.py](../../handoff247/analyzers/csharp.py) — **handles 1 operations** — C# analyzer: types, members, constructor dependencies, entry modes, switch dispatch tables, ASP.NET minimal-API routes, MCP server tools, environment variables and process launches.\n10. [handoff247/analyzers/python.py](../../handoff247/analyzers/python.py) — **handles 1 operations** — Python analyzer built on the standard ``ast`` module (no code is executed).\n\n## Successor checklist\n\n> **Notes**\n>\n> 1. Run the tests: `python -m unittest discover -s tests`.\n> 2. Regenerate the examples after any analyzer change: `python -m handoff247 build <PlayBookOS checkout> --name PlayBookOS -o examples/playbookos --notes examples/playbookos.notes.md --date <date>`. If an analyzer change surfaces new Korean comments or headings, `check --notes examples/playbookos.notes.md` reports them; add their rows to the Translations table there. Read the diff of the generated pages: a change there is a change in what successors will be told.\n> 3. Regenerate this pack after committing and pushing, so its Handover page does not report your own work as uncommitted: `python -m handoff247 . --date <date>`.\n> 4. Open `index.html` of a pack in a browser and check that every diagram renders (Mermaid errors show as red text in the page).\n\n## Known issues and risks\n\n> **Notes**\n>\n> - The rule that matters most: a wrong statement is worse than a missing one. When a pattern is ambiguous the analyzers leave it out; inferences (for example a wrapper passed in as a parameter) are labelled and drawn dashed. Keep it that way.\n> - Analysis is regex/lexer based for everything except Python (which uses `ast`). Code built from runtime strings, reflection or dependency-injection containers is not followed.\n> - MCP tool names from the C# SDK are derived from method names (snake_case, `Async` removed) and marked with * in the pack.\n> - Mermaid labels must go through `mermaid.esc`; `*`, `_` and backticks are escaped because Mermaid otherwise formats them as Markdown.\n\n## Credentials and accounts\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n## Recent commits\n\n- `ffbe44f` 2026-11-10 — v0.5.0: Codex summaries (--summarize) and an MCP server for AI agents\n- `aa7a1ae` 2026-11-10 — Regenerate the self-documentation pack at 5be3bdf\n- `5be3bdf` 2026-11-10 — v0.4.0: ontology, graph view, LLM wiki, MIT license\n- `f9c86ae` 2026-11-10 — Regenerate the self-documentation pack at 719c129\n- `719c129` 2026-11-10 — One-step handover: `handoff247 <folder>`, Handover page, folder-of-projects index (v0.3.0)\n- `243bd73` 2026-11-09 — Regenerate the self-documentation pack at fd03fe1\n- `fd03fe1` 2026-11-09 — English-only output, plus English versions for non-English source text\n- `d9b811a` 2026-11-09 — HandOff247 v0.1.0: handoff pack generator\n\n", "HANDOVER.md": "# Handover checklist\n\n<sub>Generated by HandOff247 0.5.0 from https://github.com/unkkyuist/HandOff247@ffbe44f on 2026-11-10. Re-run to refresh; edit the notes file, not this page.<\/sub>\n\n[← Back to start](README.md)\n\n\n> This page covers what the code cannot carry by itself. Findings come from the files and from Git as they were on the computer where this pack was generated; notes come from `HANDOFF.notes.md`.\n\n## Ready to hand over?\n\n13 of 13 checks are ready. Each open row says what is missing.\n\n|  | Check | Detail |\n|---|---|---|\n| ✅ | The project has a README | README.md |\n| ✅ | How to start it can be found in the files | launch scripts, an entry point or run modes were found |\n| ✅ | There are tests | 1 test file(s) |\n| ✅ | A license file says who may use the code | LICENSE |\n| ✅ | The folder is in Git with a remote | origin |\n| ✅ | Everything is committed | clean work tree |\n| ✅ | Everything is pushed | every local commit is on a remote |\n| ✅ | Nothing the program needs exists only on this computer | no ignored settings or data files |\n| ✅ | No personal folder paths are written into code | none found |\n| ✅ | No secret-looking values are stored in files | no key or token patterns matched |\n| ✅ | The notes say what the project is |  |\n| ✅ | The handover questions are answered | 8/8 answered |\n| ✅ | The most important files have notes | all have notes |\n\n\n## Unfinished work\n\n> **Notes**\n>\n> - A folder of projects has a graph and a wiki per project but no single graph across projects; `workspace.py` only writes an `llms.txt` that links them.\n> - Codex is the only engine for `--summarize` (`summarize.codex_call`). Another signed-in CLI (Claude Code's `claude -p`, for example) would be a second function with the same signature: prompt in, JSON text out.\n> - The MCP server is tested by driving it over stdio (`test_mcp_server`) and was tried once by hand with Codex. It speaks protocol versions up to 2025-11-25 and offers tools only, no resources or prompts.\n> - Go, Rust, Java and other languages are only inventoried. An analyzer for one of them is the natural next piece: copy the shape of `analyzers/python.py` and add an assertion per fact to the tests.\n> - The workspace index has no example in `examples/`; it is covered by `test_go_folder_of_projects` only.\n\n### State of the Git checkout\n\n- Branch `main` · 8 commit(s) from 2026-11-09 to 2026-11-10\n- Remotes: `origin`\n- No uncommitted changes.\n- Every local commit is on a remote.\n\n\n## Only on this computer\n\nA successor who clones the repository gets none of this.\n\n### Present here but ignored by Git\n\nNo ignored settings, data or other files are present.\n\n\n## Accounts, services and secrets\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n### External hosts (4)\n\nHost names in URLs. 'In code' means code, scripts or configuration; the r ct. |\n| File | A file of the project (images and other assets are left out). |\n| Type | A class, record, struct, interface or enum defined in a file. |\n| Run mode | A way to start the program, picked by its first argument. |\n| Sub-command | A sub-command of a command-line parser. |\n| Dispatch table | A switch or mapping that turns an operation name into the code that handles it. |\n| Operation | One named operation of a dispatch table. |\n| HTTP route | An HTTP endpoint the program serves. |\n| MCP tool | A tool the program offers to AI clients over MCP. |\n| Environment variable | An environment variable the code reads or sets (operating-system variables are left out). |\n| Port | A network port number found in an address or a port setting. |\n| Package | A third-party package the project declares or imports. |\n| External host | A host name found in a URL. |\n| Command-line tool | A well-known program the project's scripts start; it has to be installed. |\n| Person | An author in the Git history. |\n\n## Relations\n\n| Relation | Read backwards | Meaning |\n|---|---|---|\n| contains | is part of | Project → area → file. |\n| defines | is defined in | The file holds the definition. |\n| imports | is imported by | Import or include statement. |\n| uses | is used by | The code names a type defined in the other file; a run mode uses a type. |\n| takes as a dependency | is a dependency of | Constructor parameter of that type. |\n| extends | is extended by | Base class or implemented interface. |\n| loads | is loaded by | A page loads a script or stylesheet. |\n| runs | is run by | A script or configuration starts the other file. |\n| refers to | is referred to by | A string in the file is the other file's path. |\n| references | is referenced by | Project reference in a build file. |\n| documents | is documented in | A document links to the file or shows the operation in an example. |\n| serves | is served by | A run mode passes requests to the dispatch table. |\n| exposes | is exposed by | A run mode registers the HTTP route. |\n| has operation | is an operation of | Key of the dispatch table. |\n| is handled by | handles | The file that holds the handler the table calls. |\n| calls | is called from | The file asks for the operation by name (over HTTP, a process or in-process). |\n| invokes | is invoked by | An MCP tool runs the operation. |\n| forwards to | receives from | An HTTP route hands the request to the dispatch table. |\n| reads | is read by | The file reads the environment variable. |\n| sets | is set by | The file sets the environment variable. |\n| mentions | is mentioned in | The host or port appears in the file. |\n| depends on | is a dependency of | The file declares or imports the package. |\n| starts | is started by | The file starts the command-line tool. |\n| has commits in | has commits by | Author in the Git history of the project. |\n\n## Writing\n\nDo not edit these pages: the next run overwrites them. Knowledge that should last goes into `HANDOFF.notes.md`, under the heading of the thing it is about:\n\n- `## Project` — what the project is and its status\n- `## Topic: <name>` — the handover questions listed in [notes.md](notes.md)\n- `## Area: <folder>`, `## File: <path>`, `## Mode: <name>`, `## Op: <operation>` — one thing each\n\nWrite plain sentences, say only what you verified in the source, and never paste a password or token; say where it is kept. Then run `python -m handoff247 <project folder>` again: the note appears on the matching wiki page, in the handoff pages and in the viewer.\n\n## Files\n\n- `../llms.txt` — short entry point; `../llms-full.txt` — every page of this wiki in one file\n- `../ontology.json` — entities (`id`, `type`, `name`, `summary`, `page`) and relations (`s`, `p`, `o`, `file`, `line`)\n- `../index.html` — viewer with a graph of the same ontology\n\n## Working through MCP\n\n`python -m handoff247 mcp` is an MCP server over the same data: search and read entities, read source lines, list what is still undocumented, and write notes under the right heading (marked as written by an agent). It is the supported way for an assistant to add to this wiki.\n", "wiki/overview.md": "---\ngenerator: HandOff247\nid: \"project:HandOff247\"\ntype: Project\n---\n\n# HandOff247\n\n**What the previous owner says it is**\n\n> HandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\n> Status: v0.5.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. Since v0.4.0 every pack also holds the ontology (`ontology.json`), a graph of it in the viewer, and a wiki for AI assistants (`wiki/`, `llms.txt`). v0.5.0 adds optional file summaries written through the signed-in Codex CLI (`--summarize`) and an MCP server (`handoff247 mcp`) through which an AI agent reads the project and writes notes. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n- **Repository:** https://github.com/unkkyuist/HandOff247 at commit `ffbe44f`\n- **Human-readable pack:** [README](../README.md), [handover checklist](../HANDOVER.md), [how to run it](../RUNNING.md), [connections](../CONNECTIONS.md), [code map](../CODEMAP.md)\n- **What only the previous owner knew:** [notes](notes.md)\n\n## What was found\n\n| Class | Count | Where |\n|---|---|---|\n| Areas | 3 | [index](index.md), under Areas |\n| Files | 36 | [index](index.md), under Files |\n| Types | 19 | on the page of the file that defines it |\n| Sub-commands | 5 | [subcommands.md](subcommands.md) |\n| Dispatch tables | 3 | [operations.md](operations.md) |\n| Operations | 24 | [index](index.md), under Operations |\n| Ports | 1 | [ports.md](ports.md) |\n| External hosts | 4 | [hosts.md](hosts.md) |\n| Command-line tools | 2 | [commands.md](commands.md) |\n| People | 1 | [people.md](people.md) |\n\n## Relations\n\n**contains** →\n\n- [`.github`](areas/github.md)\n- [`handoff247`](areas/handoff247.md)\n- [`tests`](areas/tests.md)\n- [`.gitignore`](files/gitignore.md)\n- [`.handoffignore`](files/handoffignore.md)\n- [`HANDOFF.notes.md`](files/HANDOFF.notes.md.md)\n- [`LICENSE`](files/LICENSE.md)\n- [`README.md`](files/README.md.md)\n- [`action.yml`](files/action.yml.md)\n- [`pyproject.toml`](files/pyproject.toml.md)\n\n**has commits by** ←\n\n- [R B](people.md)\n", "wiki/notes.md": "---\ngenerator: HandOff247\n---\n\n# Notes from the previous owner\n\nWritten by a person in `HANDOFF.notes.md`; nothing on this page was derived from code. A question without an answer is a real gap: ask, do not guess.\n\n## What the project is\n\nHandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\nStatus: v0.5.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. Since v0.4.0 every pack also holds the ontology (`ontology.json`), a graph of it in the viewer, and a wiki for AI assistants (`wiki/`, `llms.txt`). v0.5.0 adds optional file summaries written through the signed-in Codex CLI (`--summarize`) and an MCP server (`handoff247 mcp`) through which an AI agent reads the project and writes notes. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n## Successor checklist\n\n1. Run the tests: `python -m unittest discover -s tests`.\n2. Regenerate the examples after any analyzer change: `python -m handoff247 build <PlayBookOS checkout> --name PlayBookOS -o examples/playbookos --notes examples/playbookos.notes.md --date <date>`. If an analyzer change surfaces new Korean comments or headings, `check --notes examples/playbookos.notes.md` reports them; add their rows to the Translations table there. Read the diff of the generated pages: a change there is a change in what successors will be told.\n3. Regenerate this pack after committing and pushing, so its Handover page does not report your own work as uncommitted: `python -m handoff247 . --date <date>`.\n4. Open `index.html` of a pack in a browser and check that every diagram renders (Mermaid errors show as red text in the page).\n\n## Known issues and risks\n\n- The rule that matters most: a wrong statement is worse than a missing one. When a pattern is ambiguous the analyzers leave it out; inferences (for example a wrapper passed in as a parameter) are labelled and drawn dashed. Keep it that way.\n- Analysis is regex/lexer based for everything except Python (which uses `ast`). Code built from runtime strings, reflection or dependency-injection containers is not followed.\n- MCP tool names from the C# SDK are derived from method names (snake_case, `Async` removed) and marked with * in the pack.\n- Mermaid labels must go through `mermaid.esc`; `*`, `_` and backticks are escaped because Mermaid otherwise formats them as Markdown.\n\n## Credentials and accounts\n\nNone. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n## Open work and next steps\n\n- A folder of projects has a graph and a wiki per project but no single graph across projects; `workspace.py` only writes an `llms.txt` that links them.\n- Codex is the only engine for `--summarize` (`summarize.codex_call`). Another signed-in CLI (Claude Code's `claude -p`, for example) would be a second function with the same signature: prompt in, JSON text out.\n- The MCP server is tested by driving it over stdio (`test_mcp_server`) and was tried once by hand with Codex. It speaks protocol versions up to 2025-11-25 and offers tools only, no resources or prompts.\n- Go, Rust, Java and other languages are only inventoried. An analyzer for one of them is the natural next piece: copy the shape of `analyzers/python.py` and add an assertion per fact to the tests.\n- The workspace index has no example in `examples/`; it is covered by `test_go_folder_of_projects` only.\n\n## Deploy and release\n\nThere is no server and no package upload. A release is a push to `main` on GitHub; people run it from a clone or use the repository as a GitHub Action (`uses: unkkyuist/HandOff247@main`), so `main` is what users get. Bump the version in `handoff247/__init__.py` and `pyproject.toml` together. To roll back, revert the commit.\n\n## Routine operations\n\nNothing runs on a schedule. CI runs on every push and pull request. The viewer loads marked, DOMPurify and Mermaid from jsDelivr at pinned versions (`render_html.py`); check now and then that those versions still load.\n\n## Data and backups\n\nThe tool stores nothing. Its only state is the Git repository. Generated packs can always be rebuilt; a project's `HANDOFF.notes.md` cannot, so it belongs in that project's repository.\n\n## People and contacts\n\nOwner: the GitHub account `unkkyuist` (issues on the repository). There are no other maintainers and no known outside users yet.\n", "wiki/operations.md": "---\ngenerator: HandOff247\n---\n\n# Dispatch tables\n\nA switch or mapping that turns an operation name into the code that handles it.\n\n3 found. [Back to the index](index.md)\n\n## `handoff247/analyzers/__init__.py:7`\n\n> 17 operation(s), picked by `dict`\n\n- **Class:** Dispatch table — A switch or mapping that turns an operation name into the code that handles it.\n- **Source:** [handoff247/analyzers/__init__.py:7](../../../handoff247/analyzers/__init__.py#L7)\n\n**has operation** →\n\n- [`batch`](operations/batch.md) · [handoff247/analyzers/__init__.py:16](../../../handoff247/analyzers/__init__.py#L16)\n- [`csharp`](operations/csharp.md) · [handoff247/analyzers/__init__.py:8](../../../handoff247/analyzers/__init__.py#L8)\n- [`css`](operations/css.md) · [handoff247/analyzers/__init__.py:13](../../../handoff247/analyzers/__init__.py#L13)\n- [`dockerfile`](operations/dockerfile.md) · [handoff247/analyzers/__init__.py:23](../../../handoff247/analyzers/__init__.py#L23)\n- [`html`](operations/html.md) · [handoff247/analyzers/__init__.py:12](../../../handoff247/analyzers/__init__.py#L12)\n- [`javascript`](operations/javascript.md) · [handoff247/analyzers/__init__.py:10](../../../handoff247/analyzers/__init__.py#L10)\n- [`json`](operations/json.md) · [handoff247/analyzers/__init__.py:19](../../../handoff247/analyzers/__init__.py#L19)\n- [`markdown`](operations/markdown.md) · [handoff247/analyzers/__init__.py:17](../../../handoff247/analyzers/__init__.py#L17)\n- [`msbuild`](operations/msbuild.md) · [handoff247/analyzers/__init__.py:22](../../../handoff247/analyzers/__init__.py#L22)\n- [`powershell`](operations/powershell.md) · [handoff247/analyzers/__init__.py:14](../../../handoff247/analyzers/__init__.py#L14)\n- [`python`](operations/python.md) · [handoff247/analyzers/__init__.py:9](../../../handoff247/analyzers/__init__.py#L9)\n- [`requirements`](operations/requirements.md) · [handoff247/analyzers/__init__.py:21](../../../handoff247/analyzers/__init__.py#L21)\n- [`shell`](operati <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TABS = [['README.md', 'Overview'], ['HANDOVER.md', 'Handover'], ['RUNNING.md', 'Running'], ['CONNECTIONS.md', 'Connections'],
  ['CODEMAP.md', 'Code map'], ['FILES.md', 'Files'], ['@graph', 'Graph'], ['wiki/index.md', 'Wiki'], ['@search', 'Search']];
const filesByPath = Object.fromEntries(DATA.files.map(f => [f.path, f]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = 'README.md', mermaidSeq = 0;
if (window.mermaid) mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'default', flowchart: {htmlLabels: true, useMaxWidth: false, wrappingWidth: 320}});

function tabs() {
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  for (const [id, label] of TABS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === current || (id === 'wiki/index.md' && current.startsWith('wiki/')));
    b.onclick = () => show(id); nav.append(b);
  }
}
// a link written inside wiki/…/page.md is relative to that page; the viewer sits at the pack root
function resolveHref(href) {
  if (/^[a-z][a-z0-9+.-]*:|^#|^\//i.test(href) || current.startsWith('@') || !current.includes('/')) return href;
  const [path, frag] = href.split('#');
  const parts = current.split('/').slice(0, -1);
  for (const seg of path.split('/')) {
    if (seg === '..') { if (parts.length && parts[parts.length - 1] !== '..') parts.pop(); else parts.push('..'); }
    else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/') + (path.endsWith('/') ? '/' : '') + (frag ? '#' + frag : '');
}

}
async function show(id, anchor) {

function wireLinks(root) {

function lineOf(href) { const m = href.match(/#L(\d+)$/); return m ? +m[1] : 0; }

    const d = down; down = null; G.drag = null; cv.style.cursor = 'grab';
    if (!d || d.moved) return;
    if (d.n) { G.sel = d.n; openEntity(d.n.e.id); } else { G.sel = null; closeDrawer(); }
    G.dirty = true;
  };
  cv.onpointercancel = () => { down = null; G.drag = null; };
  cv.onpointerleave = () => { if (G.hover) { G.hover = null; G.dirty = true; } tip.style.display = 'none'; };
  cv.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = cv.getBoundingClientRect(), px = ev.clientX - r.left - r.width / 2, py = ev.clientY - r.top - r.height / 2;
    const k = Math.min(6, Math.max(.05, G.k * Math.exp(-ev.deltaY * .0015)));
    G.tx = px - (px - G.tx) / G.k * k; G.ty = py - (py - G.ty) / G.k * k; G.k = k; G.auto = false; G.dirty = true;
  }, {passive: false});
  document.getElementById('gfit').onclick = () => { G.auto = G.alpha > .02; gfit(); };
  document.getElementById('glab').onchange = ev => { G.labels = ev.target.checked; G.dirty = true; };
  const q = document.getElementById('gq');
  q.oninput = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    G.match = words.length ? new Set(G.vis.filter(n => { const hay = (n.e.name + ' ' + n.c.label + ' ' + (n.e.summary || '')).toLowerCase(); return words.every(x => hay.includes(x)); })) : null;
    G.dirty = true; gcount();
  };
  q.onkeydown = ev => { if (ev.key === 'Enter' && G.match && G.match.size) focusEntity([...G.match].sort((a, b) => b.deg - a.deg)[0].e.id); };
}
window.addEventListener('resize', () => { G.dirty = true; });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { gcolors(); G.dirty = true; });
function searchPage(q) {
  current = '@search'; tabs();
  const page = document.getElementById('page');
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = DATA.files.filter(f => {
    const hay = (f.path + ' ' + f.summary + ' ' + f.note + ' ' + (f.model ? f.model.summary : '') + ' ' + f.symbols.map(s => s.name + ' ' + s.doc).join(' ')).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  page.innerHTML = `<h1>Search</h1><p class="muted">${hits.length} / ${DATA.files.length}</p>` +
    hits.slice(0, 300).map(f => `<div class="filehit" data-path="${esc(f.path)}"><strong>${esc(f.path)}</strong> <span class="chip">${esc(f.lang)}</span><br><span class="muted">${esc(f.note || f.summary || (f.model ? '(model) ' + f.model.summary : ''))}</span></div>`).join('');
  page.querySelectorAll('.filehit').forEach(el => el.onclick = () => openCard(el.dataset.path));
}
document.getElementById('q').addEventListener('input', e => searchPage(e.target.value));
const start = decodeURIComponent(location.hash.slice(1));
show(DATA.pages[start] || start === '@graph' ? start : 'README.md');
</script>
