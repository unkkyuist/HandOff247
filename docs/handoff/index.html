<script id="data" type="application/json">{"pages": {"README.md": "# Handoff: HandOff247\n\n<sub>Generated by HandOff247 0.3.0 from https://github.com/unkkyuist/HandOff247@719c129 on 2026-11-10. Re-run to refresh; edit the notes file, not this page.<\/sub>\n\n\n> How to read this pack: everything without a 'Notes' label was found in the code and links to the line it came from. Notes were written by a person in `HANDOFF.notes.md`. Dashed arrows are inferences — check them before relying on them.\n\n> Handover status: **12 of 13** checks ready — see [HANDOVER.md](HANDOVER.md).\n\n## At a glance\n\n| files | lines | languages | operations |\n|---|---|---|---|\n| 31 | 6,429 | 1 | 20 |\n\nPython 24 (5,912 lines)\n\n\n## What this project is\n\n> **Notes**\n>\n> HandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\n> Status: v0.3.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n\nFrom [README.md](../../README.md): *Hand Off 24-7 is a good-bye project for passing your existing projects to the next person.*\n\n\n## System map\n\nLaunch scripts start the program; each mode exposes interfaces; every caller ends up in the dispatch table, which hands work to the handler files.\n\n```mermaid\nflowchart LR\n  n1{{\"handoff247/analyzers/#95;#95;init#95;#95;.py:7 · 17 ops\"}}:::table\n  n2{{\"handoff247/leaving.py:257 · 3 ops\"}}:::table\n  subgraph g3[\"Handlers\"]\n    n4[\"docs.py\"]:::file\n    n5[\"web.py\"]:::file\n    n6[\"shell.py\"]:::file\n    n7[\"csharp.py\"]:::file\n    n8[\"python.py\"]:::file\n  end\n  n1 -->|\"csharp\"| n7\n  n1 -->|\"python\"| n8\n  n1 -->|\"css, html, javascript … (4)\"| n5\n  n1 -->|\"batch, powershell, shell\"| n6\n  n1 -->|\"dockerfile, json, markdown … (8)\"| n4\n  classDef entry fill:#fde68a,stroke:#b45309,color:#1f2937\n  classDef launcher fill:#e0e7ff,stroke:#4338ca,color:#1f2937\n  classDef mode fill:#dcfce7,stroke:#15803d,color:#1f2937\n  classDef iface fill:#cffafe,stroke:#0e7490,color:#1f2937\n  classDef table fill:#fce7f3,stroke:#be185d,color:#1f2937\n  classDef hub fill:#f3f4f6,stroke:#6b7280,color:#1f2937,stroke-dasharray:4 3\n  classDef data fill:#fef3c7,stroke:#92400e,color:#1f2937\n  classDef ext fill:#ffffff,stroke:#9ca3af,color:#374151,stroke-dasharray:2 2\n  classDef test fill:#ede9fe,stroke:#6d28d9,color:#1f2937\n  classDef file fill:#ffffff,stroke:#64748b,color:#1f2937\n```\n\n<sub>Mermaid source: diagrams/system.mmd<\/sub>\n\n\n## Pages\n\n- [HANDOVER.md](HANDOVER.md) — Handover checklist — what is ready, unfinished work, what exists only on one computer, accounts, people\n- [RUNNING.md](RUNNING.md) — How it runs — launch chain, modes, environment variables, ports, build and tests\n- [CONNECTIONS.md](CONNECTIONS.md) — How the tools connect — operations, HTTP routes, MCP tools, callers\n- [CODEMAP.md](CODEMAP.md) — Code map — which file depends on which\n- [FILES.md](FILES.md) — File cards — one card per file with comments, symbols and links\n- [index.html](index.html) — Interactive viewer (open index.html in a browser)\n\n## Suggested reading order\n\n1. [README.md](../../README.md) — **what the project says about itself**\n2. [handoff247/analyzers/__init__.py](../../handoff247/analyzers/__init__.py) — **dispatch table: 17 operations** — Per-language analyzers.\n3. [handoff247/leaving.py](../../handoff247/leaving.py) — **dispatch table: 3 operations** — What the code alone cannot hand over: unfinished work, things that exist only on the computer the pack was generated on, accounts and services, tools to install, people.\n4. [handoff247/model.py](../../handoff247/model.py) — **shared foundation used by 15 files** — Data model shared by every analyzer and renderer.\n5. [handoff247/analyzers/docs.py](../../handoff247/analyzers/docs.py) — **handles 8 operations** — Markdown/text documents and configuration files (MSBuild, package.json, pyproject, requirements, MCP client configs, Dockerfile, GitHub workflows).\n6. [handoff247/analyzers/web.py](../../handoff247/analyzers/web.py) — **handles 4 operations** — JavaScript/TypeScript, HTML and CSS analyzers.\n7. [handoff247/analyzers/shell.py](../../handoff247/analyzers/shell.py) — **handles 3 operations** — PowerShell, POSIX shell and Windows batch analyzers (line based, no execution).\n8. [handoff247/analyzers/csharp.py](../../handoff247/analyzers/csharp.py) — **handles 1 operations** — C# analyzer: types, members, constructor dependencies, entry modes, switch dispatch tables, ASP.NET minimal-API routes, MCP server tools, environment variables and process launches.\n9. [handoff247/analyzers/python.py](../../handoff247/analyzers/python.py) — **handles 1 operations** — Python analyzer built on the standard ``ast`` module (no code is executed).\n\n## Successor checklist\n\n> **Notes**\n>\n> 1. Run the tests: `python -m unittest discover -s tests`.\n> 2. Regenerate the examples after any analyzer change: `python -m handoff247 build <PlayBookOS checkout> --name PlayBookOS -o examples/playbookos --notes examples/playbookos.notes.md --date <date>`. If an analyzer change surfaces new Korean comments or headings, `check --notes examples/playbookos.notes.md` reports them; add their rows to the Translations table there. Read the diff of the generated pages: a change there is a change in what successors will be told.\n> 3. Regenerate this pack after committing and pushing, so its Handover page does not report your own work as uncommitted: `python -m handoff247 . --date <date>`.\n> 4. Open `index.html` of a pack in a browser and check that every diagram renders (Mermaid errors show as red text in the page).\n\n## Known issues and risks\n\n> **Notes**\n>\n> - The rule that matters most: a wrong statement is worse than a missing one. When a pattern is ambiguous the analyzers leave it out; inferences (for example a wrapper passed in as a parameter) are labelled and drawn dashed. Keep it that way.\n> - Analysis is regex/lexer based for everything except Python (which uses `ast`). Code built from runtime strings, reflection or dependency-injection containers is not followed.\n> - MCP tool names from the C# SDK are derived from method names (snake_case, `Async` removed) and marked with * in the pack.\n> - Mermaid labels must go through `mermaid.esc`; `*`, `_` and backticks are escaped because Mermaid otherwise formats them as Markdown.\n\n## Credentials and accounts\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n## Recent commits\n\n- `719c129` 2026-11-10 — One-step handover: `handoff247 <folder>`, Handover page, folder-of-projects index (v0.3.0)\n- `243bd73` 2026-11-09 — Regenerate the self-documentation pack at fd03fe1\n- `fd03fe1` 2026-11-09 — English-only output, plus English versions for non-English source text\n- `d9b811a` 2026-11-09 — HandOff247 v0.1.0: handoff pack generator\n\n", "HANDOVER.md": "# Handover checklist\n\n<sub>Generated by HandOff247 0.3.0 from https://github.com/unkkyuist/HandOff247@719c129 on 2026-11-10. Re-run to refresh; edit the notes file, not this page.<\/sub>\n\n[← Back to start](README.md)\n\n\n> This page covers what the code cannot carry by itself. Findings come from the files and from Git as they were on the computer where this pack was generated; notes come from `HANDOFF.notes.md`.\n\n## Ready to hand over?\n\n12 of 13 checks are ready. Each open row says what is missing.\n\n|  | Check | Detail |\n|---|---|---|\n| ✅ | The project has a README | README.md |\n| ✅ | How to start it can be found in the files | launch scripts, an entry point or run modes were found |\n| ✅ | There are tests | 1 test file(s) |\n| ⚠️&nbsp;to&nbsp;do | A license file says who may use the code | no LICENSE file |\n| ✅ | The folder is in Git with a remote | origin |\n| ✅ | Everything is committed | clean work tree |\n| ✅ | Everything is pushed | every local commit is on a remote |\n| ✅ | Nothing the program needs exists only on this computer | no ignored settings or data files |\n| ✅ | No personal folder paths are written into code | none found |\n| ✅ | No secret-looking values are stored in files | no key or token patterns matched |\n| ✅ | The notes say what the project is |  |\n| ✅ | The handover questions are answered | 8/8 answered |\n| ✅ | The most important files have notes | all have notes |\n\n\n## Unfinished work\n\n> **Notes**\n>\n> - The repository has no LICENSE file yet; the owner has not chosen one.\n> - Go, Rust, Java and other languages are only inventoried. An analyzer for one of them is the natural next piece: copy the shape of `analyzers/python.py` and add an assertion per fact to the tests.\n> - The workspace index has no example in `examples/`; it is covered by `test_go_folder_of_projects` only.\n\n### State of the Git checkout\n\n- Branch `main` · 4 commit(s) from 2026-11-09 to 2026-11-10\n- Remotes: `origin`\n- No uncommitted changes.\n- Every local commit is on a remote.\n\n\n## Only on this computer\n\nA successor who clones the repository gets none of this.\n\n### Present here but ignored by Git\n\nNo ignored settings, data or other files are present.\n\n\n## Accounts, services and secrets\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n### External <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TABS = [['README.md', 'Overview'], ['HANDOVER.md', 'Handover'], ['RUNNING.md', 'Running'], ['CONNECTIONS.md', 'Connections'],
  ['CODEMAP.md', 'Code map'], ['FILES.md', 'Files'], ['@search', 'Search']];
const filesByPath = Object.fromEntries(DATA.files.map(f => [f.path, f]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = 'README.md', mermaidSeq = 0;
if (window.mermaid) mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'default', flowchart: {htmlLabels: true, useMaxWidth: false, wrappingWidth: 320}});

function tabs() {
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  for (const [id, label] of TABS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === current); b.onclick = () => show(id); nav.append(b);
  }
}
function md(text) {
  if (!window.marked) return '<pre>' + esc(text) + '</pre>';
  const raw = marked.parse(text, {gfm: true});
  return window.DOMPurify ? DOMPurify.sanitize(raw, {ADD_ATTR: ['target']}) : '<pre>' + esc(text) + '</pre>';
}
async function show(id, anchor) {
  current = id; tabs();
  const page = document.getElementById('page');
  if (id === '@search') { searchPage(document.getElementById('q').value); return; }
  page.innerHTML = md(DATA.pages[id] || '');
  wireLinks(page);
  await drawDiagrams(page);
  if (anchor) document.getElementById(anchor)?.scrollIntoView(); else window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function wireLinks(root) {
  root.querySelectorAll('h2,h3').forEach(h => { if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}_]+/gu, '-'); });
  root.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (DATA.pages[href]) { a.onclick = e => { e.preventDefault(); show(href); }; return; }
    if (href.startsWith('#')) return;
    const path = toProjectPath(href);
    if (path && filesByPath[path]) {
      a.onclick = e => { if (e.ctrlKey || e.metaKey) return; e.preventDefault(); openCard(path, lineOf(href)); };
    } else { a.target = '_blank'; a.rel = 'noopener'; }
  });
}
function lineOf(href) { const m = href.match(/#L(\d+)$/); return m ? +m[1] : 0; }
function toProjectPath(href) {
  let h = decodeURIComponent(href.split('#')[0]);
  if (DATA.linkBase && h.startsWith(DATA.linkBase)) return h.slice(DATA.linkBase.length);
  if (DATA.relPrefix && h.startsWith(DATA.relPrefix)) return h.slice(DATA.relPrefix.length);
  return filesByPath[h] ? h : null;
}
async function drawDiagrams(root) {
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')];
  for (const code of blocks) {
    const src = code.textContent;
    const diagram = Object.values(DATA.diagrams).find(d => d.source.trim() === src.trim());
    const box = document.createElement('div'); box.className = 'diagram';
    const tools = document.createElement('div'); tools.className = 'tools';
    let zoom = 1;
    const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; tools.append(b); };
    const canvas = document.createElement('div');
    const fit = () => { const svg = canvas.querySelector('svg'); if (!svg) return;
      zoom = Math.min(1, (box.clientWidth - 26) / (svg.getBoundingClientRect().width / zoom)); canvas.style.zoom = zoom; };
    mk('−', () => { zoom = Math.max(.2, zoom - .15); canvas.style.zoom = zoom; });
    mk('+', () => { zoom = Math.min(3, zoom + .15); canvas.style.zoom = zoom; });
    mk('Fit', fit);
    mk('1:1', () => { zoom = 1; canvas.style.zoom = 1; });
    box.append(tools, canvas);
    code.parentElement.replaceWith(box);
    if (!window.mermaid) { canvas.innerHTML = '<pre>' + esc(src) + '</pre>'; continue; }
    try {
      const {svg} = await mermaid.render('hf' + (++mermaidSeq), src);
      canvas.innerHTML = svg;
      fit();
      if (diagram) canvas.querySelectorAll('g.node').forEach(g => {
        const m = (g.id || '').match(/flowchart-(n\d+)-/); const path = m && diagram.files[m[1]];
        if (path && filesByPath[path]) { g.addEventListener('click', () => openCard(path)); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); }
      });
    } catch (e) { canvas.innerHTML = '<pre>' + esc(src) + '\n\n' + esc(e.message || e) + '</pre>'; }
  }
}
function link(path, line, label) {
  const f = filesByPath[path];
  return f ? `<a href="#" data-path="${esc(path)}" data-line="${line || 0}">${esc(label || path)}</a>` : esc(label || path);
}
function openCard(path, line) {
  const f = filesByPath[path]; if (!f) return;
  let h = `<h2>${esc(f.path)}${line ? ' <span class="muted">:' + line + '</span>' : ''}</h2>`;
  h += `<div><span class="chip">${esc(f.lang)}</span><span class="chip">${f.lines} lines</span><span class="chip">${esc(f.category)}</span>${f.tags.filter(t => !t.startsWith('ns:')).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  if (f.source_url) h += `<p><a href="${esc(f.source_url)}${line ? '#L' + line : ''}" target="_blank" rel="noopener">Open source ↗</a></p>`;
  if (f.note) h += `<h3>Notes</h3><div class="note">${esc(f.note)}</div>`;
  if (f.summary) h += `<h3>Comment</h3><p>${esc(f.summary)} <span class="muted">(${esc(f.summary_source)})</span></p>`;
  if (f.translated) h += `<p class="muted">${f.translated} heading(s) or comment(s) here are English versions from the notes file; the originals are in handoff.json.</p>`;
  if (f.symbols.length) h += `<h3>Symbols</h3><ul class="list">` + f.symbols.slice(0, 60).map(s => `<li><code>${esc((s.parent && s.kind === 'method' ? s.parent + '.' : '') + s.name)}</code> <span class="muted">${esc(s.kind)} · L${s.line}</span>${s.doc ? '<br>' + esc(s.doc) : ''}</li>`).join('') + '</ul>';
  for (const [title, list, arrow] of [['Links out', f.out, '→'], ['Links in', f.in, '←']]) {
    if (!list.length) continue;
    h += `<h3>${title}</h3><ul class="list">` + list.map(e => `<li><span class="chip">${esc(e.kind)}</span>${arrow} ${link(e.other, 0, e.other)}${e.label ? ' <span class="muted">' + esc(e.label) + '</span>' : ''}</li>`).join('') + '</ul>';
  }
  const card = document.getElementById('card'); card.innerHTML = h;
  card.querySelectorAll('a[data-path]').forEach(a => a.onclick = e => { e.preventDefault(); openCard(a.dataset.path, +a.dataset.line); });
  const d = document.getElementById('drawer'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); d.scrollTop = 0;
}
function closeDrawer() { const d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
function searchPage(q) {
  current = '@search'; tabs();
  const page = document.getElementById('page');
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = DATA.files.filter(f => {
    const hay = (f.path + ' ' + f.summary + ' ' + f.note + ' ' + f.symbols.map(s => s.name + ' ' + s.doc).join(' ')).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  page.innerHTML = `<h1>Search</h1><p class="muted">${hits.length} / ${DATA.files.length}</p>` +
    hits.slice(0, 300).map(f => `<div class="filehit" data-path="${esc(f.path)}"><strong>${esc(f.path)}</strong> <span class="chip">${esc(f.lang)}</span><br><span class="muted">${esc(f.note || f.summary || '')}</span></div>`).join('');
  page.querySelectorAll('.filehit').forEach(el => el.onclick = () => openCard(el.dataset.path));
}
document.getElementById('q').addEventListener('input', e => searchPage(e.target.value));
const start = decodeURIComponent(location.hash.slice(1));
show(DATA.pages[start] ? start : 'README.md');
</script>
