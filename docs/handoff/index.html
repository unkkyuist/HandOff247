yBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n\nFrom [README.md](../../README.md): *Hand Off 24-7 is a good-bye project for passing your existing projects to the next person.*\n\n\n## System map\n\nLaunch scripts start the program; each mode exposes interfaces; every caller ends up in the dispatch table, which hands work to the handler files.\n\n```mermaid\nflowchart LR\n  n1{{\"handoff247/analyzers/#95;#95;init#95;#95;.py:7 · 17 ops\"}}:::table\n  n2{{\"handoff247/journeys.py:139 · 13 ops\"}}:::table\n  n3{{\"handoff247/leaving.py:257 · 3 ops\"}}:::table\n  n4{{\"handoff247/mcp.py:421 · 6 ops\"}}:::table\n  subgraph g5[\"Handlers\"]\n    n6[\"docs.py\"]:::file\n    n7[\"web.py\"]:::file\n    n8[\"shell.py\"]:::file\n    n9[\"csharp.py\"]:::file\n    n10[\"python.py\"]:::file\n  end\n  n1 -->|\"csharp\"| n9\n  n1 -->|\"python\"| n10\n  n1 -->|\"css, html, javascript … (4)\"| n7\n  n1 -->|\"batch, powershell, shell\"| n8\n  n1 -->|\"dockerfile, json, markdown … (8)\"| n6\n  classDef entry fill:#fde68a,stroke:#b45309,color:#1f2937\n  classDef launcher fill:#e0e7ff,stroke:#4338ca,color:#1f2937\n  classDef mode fill:#dcfce7,stroke:#15803d,color:#1f2937\n  classDef iface fill:#cffafe,stroke:#0e7490,color:#1f2937\n  classDef table fill:#fce7f3,stroke:#be185d,color:#1f2937\n  classDef hub fill:#f3f4f6,stroke:#6b7280,color:#1f2937,stroke-dasharray:4 3\n  classDef data fill:#fef3c7,stroke:#92400e,color:#1f2937\n  classDef ext fill:#ffffff,stroke:#9ca3af,color:#374151,stroke-dasharray:2 2\n  classDef test fill:#ede9fe,stroke:#6d28d9,color:#1f2937\n  classDef file fill:#ffffff,stroke:#64748b,color:#1f2937\n```\n\n<sub>Mermaid source: diagrams/system.mmd<\/sub>\n\n\n## Pages\n\n- [HANDOVER.md](HANDOVER.md) — Handover checklist — what is ready, unfinished work, what exists only on one computer, accounts, people\n- [USERS.md](USERS.md) — Who uses it — user types, their screens, what each control does, hand-overs between user types, assets in context\n- [RUNNING.md](RUNNING.md) — How it runs — launch chain, modes, environment variables, ports, build and tests\n- [CONNECTIONS.md](CONNECTIONS.md) — How the tools connect — operations, HTTP routes, MCP tools, callers\n- [CODEMAP.md](CODEMAP.md) — Code map — which file depends on which\n- [FILES.md](FILES.md) — File cards — one card per file with comments, symbols and links\n- [index.html](index.html) — Interactive viewer with a graph of everything found (open index.html in a browser)\n- [wiki/index.md](wiki/index.md) — Wiki for AI assistants — one small page per file, operation, tool and run mode, all interlinked\n- [llms.txt](llms.txt) — Entry point for AI assistants (llms.txt convention); llms-full.txt is the whole wiki in one file\n- [ontology.json](ontology.json) — The ontology as data — every entity and relation, with the file and line it was observed at\n\n## Suggested reading order\n\n1. [README.md](../../README.md) — **what the project says about itself**\n2. [handoff247/analyzers/__init__.py](../../handoff247/analyzers/__init__.py) — **dispatch table: 17 operations** — Per-language analyzers.\n3. [handoff247/journeys.py](../../handoff247/journeys.py) — **dispatch table: 13 operations** — The application as its users meet it.\n4. [handoff247/leaving.py](../../handoff247/leaving.py) — **dispatch table: 3 operations** — What the code alone cannot hand over: unfinished work, things that exist only on the computer the pack was generated on, accounts and services, tools to install, people.\n5. [handoff247/mcp.py](../../handoff247/mcp.py) — **dispatch table: 6 operations** — MCP server (stdio, JSON-RPC 2.0, one message per line) so an AI agent can work with a project it has never seen: get a briefing of the whole project, follow what each kind of user sees and does, trace a user's request from their own words to the code, read any page of the pack, the ontology and the…\n6. [handoff247/model.py](../../handoff247/model.py) — **shared foundation used by 20 files** — Data model shared by every analyzer and renderer.\n7. [handoff247/analyzers/docs.py](../../handoff247/analyzers/docs.py) — **handles 8 operations** — Markdown/text documents and configuration files (MSBuild, package.json, pyproject, requirements, MCP client configs, Dockerfile, GitHub workflows).\n8. [handoff247/analyzers/web.py](../../handoff247/analyzers/web.py) — **handles 4 operations** — JavaScript/TypeScript, HTML and CSS analyzers.\n9. [handoff247/analyzers/shell.py](../../handoff247/analyzers/shell.py) — **handles 3 operations** — PowerShell, POSIX shell and Windows batch analyzers (line based, no execution).\n10. [handoff247/analyzers/csharp.py](../../handoff247/analyzers/csharp.py) — **handles 1 operations** — C# analyzer: types, members, constructor dependencies, entry modes, switch dispatch tables, ASP.NET minimal-API routes, MCP server tools, environment variables and process launches.\n11. [handoff247/analyzers/python.py](../../handoff247/analyzers/python.py) — **handles 1 operations** — Python analyzer built on the standard ``ast`` module (no code is executed).\n\n## Successor checklist\n\n> **Notes**\n>\n> 1. Run the tests: `python -m unittest discover -s tests`.\n> 2. Regenerate the examples after any analyzer change (`examples/newsroom` too: `python -m handoff247 build tests/fixtures/newsroom --name Newsroom -o examples/newsroom --notes examples/newsroom.notes.md --date <date> --link-base https://github.com/unkkyuist/HandOff247/blob/main/tests/fixtures/newsroom/`): `python -m handoff247 build <PlayBookOS checkout> --name PlayBookOS -o examples/playbookos --notes examples/playbookos.notes.md --date <date>`. If an analyzer change surfaces new Korean comments or headings, `check --notes examples/playbookos.notes.md` reports them; add their rows to the Translations table there. Read the diff of the generated pages: a change there is a change in what successors will be told.\n> 3. Regenerate this pack after committing and pushing, so its Handover page does not report your own work as uncommitted: `python -m handoff247 . --date <date>`.\n> 4. Open `index.html` of a pack in a browser and check that every diagram renders (Mermaid errors show as red text in the page).\n\n## Known issues and risks\n\n> **Notes**\n>\n> - The rule that matters most: a wrong statement is worse than a missing one. When a pattern is ambiguous the analyzers leave it out; inferences (for example a wrapper passed in as a parameter) are labelled and drawn dashed. Keep it that way.\n> - Analysis is regex/lexer based for everything except Python (which uses `ast`). Code built from runtime strings, reflection or dependency-injection containers is not followed.\n> - MCP tool names from the C# SDK are derived from method names (snake_case, `Async` removed) and marked with * in the pack.\n> - Mermaid labels must go through `mermaid.esc`; `*`, `_` and backticks are escaped because Mermaid otherwise formats them as Markdown.\n\n## Credentials and accounts\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n## Recent commits\n\n- `f0caf56` 2026-11-14 — v0.6.0: the application from its users' side, and an MCP server that briefs an agent on the whole project\n- `3cdb94f` 2026-11-10 — Regenerate the self-documentation pack at ffbe44f\n- `ffbe44f` 2026-11-10 — v0.5.0: Codex summaries (--summarize) and an MCP server for AI agents\n- `aa7a1ae` 2026-11-10 — Regenerate the self-documentation pack at 5be3bdf\n- `5be3bdf` 2026-11-10 — v0.4.0: ontology, graph view, LLM wiki, MIT license\n- `f9c86ae` 2026-11-10 — Regenerate the self-documentation pack at 719c129\n- `719c129` 2026-11-10 — One-step handover: `handoff247 <folder>`, Handover page, folder-of-projects index (v0.3.0)\n- `243bd73` 2026-11-09 — Regenerate the self-documentation pack at fd03fe1\n\n", "HANDOVER.md": "# Handover checklist\n\n<sub>Generated by HandOff247 0.6.0 from https://github.com/unkkyuist/HandOff247@f0caf56 on 2026-11-14. Re-run to refresh; edit the notes file, not this page.<\/sub>\n\n[← Back to start](README.md)\n\n\n> This page covers what the code cannot carry by itself. Findings come from the files and from Git as they were on the computer where this pack was generated; notes come from `HANDOFF.notes.md`.\n\n## Ready to hand over?\n\n13 of 13 checks are ready. Each open row says what is missing.\n\n|  | Check | Detail |\n|---|---|---|\n| ✅ | The project has a README | README.md |\n| ✅ | How to start it can be found in the files | launch scripts, an entry point or run modes were found |\n| ✅ | There are tests | 1 test file(s) |\n| ✅ | A license file says who may use the code | LICENSE |\n| ✅ | The folder is in Git with a remote | origin |\n| ✅ | Everything is committed | clean work tree |\n| ✅ | Everything is pushed | every local commit is on a remote |\n| ✅ | Nothing the program needs exists only on this computer | no ignored settings or data files |\n| ✅ | No personal folder paths are written into code | none found |\n| ✅ | No secret-looking values are stored in files | no key or token patterns matched |\n| ✅ | The notes say what the project is |  |\n| ✅ | The handover questions are answered | 8/8 answered |\n| ✅ | The most important files have notes | all have notes |\n\n\n## Unfinished work\n\n> **Notes**\n>\n> - A folder of projects has a graph and a wiki per project but no single graph across projects; `workspace.py` only writes an `llms.txt` that links them.\n> - Codex is the only engine for `--summarize` (`summarize.codex_call`). Another signed-in CLI (Claude Code's `claude -p`, for example) would be a second function with the same signature: prompt in, JSON text out.\n> - The MCP server is tested by driving it over stdio (`test_mcp_server`) and was tried once by hand with Codex. It speaks protocol versions up to 2025-11-25 and offers tools only, no resources or prompts.\n> - The user-context view follows Python handlers only (Flask-style routes, SQL written as strings). An ORM, Django URL patterns, and handlers in JavaScript or C# are not followed; their routes are listed with what sits on the route itself and reported under \"Not verified\". Controls of a single-page app that a script wires up are listed without a target. The next analyzers to write are an Express handler reader and an ORM model reader, each with an assertion per fact in `UserContextTests`.\n> - Go, Rust, Java and other languages are only inventoried. An analyzer for one of them is the natural next piece: copy the shape of `analyzers/python.py` and add an assertion per fact to the tests.\n> - The workspace index has no example in `examples/`; it is covered by `test_go_folder_of_projects` only.\n\n### State of the Git checkout\n\n- Branch `main` · 10 commit(s) from 2026-11-09 to 2026-11-14\n- Remotes: `origin`\n- No uncommitted changes.\n- Every local commit is on a remote.\n\n\n## Only on this computer\n\nA successor who clones the repository gets none of this.\n\n### Present here but ignored by Git\n\nNo ignored settings, data or other files are present.\n\n### Absolute paths written into files (3)\n\nThese point at one computer's folders. Paths under a user's home folder are marked **personal**.\n\n| Path | Where |  |\n|---|---|---|\n| `C:\\x\\y.py` | [handoff247/cli.py:130](../../handoff247/cli.py#L130) |  |\n| `C:/tools/HandOff247` | [README.md:394](../../README.md#L394) |  |\n| `C:/work/my-project` | [README.md:393](../../README.md#L393) |  |\n\n\n## Accounts, services and secrets\n\n> **Notes**\n>\n> None. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n### External hosts (4)\n\nHost names in URLs. 'In code' means code, scripts or configuration; the rest only appear in documents.\n\n| Host | In code | f247__wiki.py.md) — Writes the ontology as Markdown pages plus `llms.txt` and `llms-full.txt`. `assign_pages` decides which page describes an entity (own page for files, areas, modes, operations and MCP tools; a list page for the small cla…\n- [`handoff247/workspace.py`](files/handoff247__workspace.py.md) — The folder-of-projects mode: finds projects one or two levels down, builds a pack for each, and writes the index (README.md, index.html, workspace.json, workspace.mmd). It does not write into the projects: notes for a p…\n\n### tests\n\n- [`tests/test_handoff.py`](files/tests__test_handoff.py.md) — Runs the full pipeline on a copy of the fixture outside Git, so both file-listing paths are covered.\n", "wiki/AGENTS.md": "---\ngenerator: HandOff247\n---\n\n# How to use this wiki\n\nThis wiki describes **HandOff247** for an AI assistant that has to answer questions about the project or change it. HandOff247 generated it by static analysis; it did not run the code and no language model wrote these pages.\n\n## Reading\n\n1. Start at [index.md](index.md). Open [overview.md](overview.md), then only the pages the question needs.\n2. Each page is one thing. `Relations` lists what it points to (→) and what points to it (←); follow those links.\n3. A `file:line` next to a statement is where it was observed. Open that source before you change code.\n4. *inferred* marks a conclusion, not an observation. Check it in the source before relying on it.\n   Text labelled *written by a language model* (and *(model)* in lists) was not checked by a person either.\n5. Something that is not in the wiki was not found. That does not mean it does not exist: code built from runtime strings, reflection or dependency-injection containers is not followed. Say that you do not know.\n6. [notes.md](notes.md) is the only human-written page. \"Not answered\" there is a question for a person.\n\n## Helping someone who uses the application\n\nThe user types in this wiki (`users/`) are the kinds of user the analysed application tells apart. They are not access levels of the wiki: read every flow you need, whoever it belongs to. Five ways in:\n\n- **From a user type:** `users/<name>.md` lists the screens, what each control does and who picks the work up next.\n- **From words on a screen:** [terms.md](terms.md) has every link, button, field label, heading and message, with the feature it leads to. The word a user says and the name in the code often differ; the page gives both.\n- **From an asset or a table:** `assets/` and `data/` say who provides it, what stores it and where it shows.\n- **From code:** a file page lists the features that run it under *runs for*; a feature page lists its code.\n- **From a request:** find the feature through the words, then read its page in `features/`: started from, what the code does, branches, hand-overs, what to check, not verified.\n\nTwo rules when you answer. The same word can be on several screens: name the screen and the user type, and if two candidates fit, show both instead of picking one. And a condition in the code is not a diagnosis: \"the article is only listed when status is in_review\" is what the code does, not proof of why this user's article is missing. Say what to check (*What to check* on the feature page) unless you have the live data or a log.\n\n## Classes\n\n| Class | Meaning |\n|---|---|\n| Project | The thing being handed over. |\n| Area | A top-level folder of the project. |\n| File | A file of the project (images and other assets are left out). |\n| Type | A class, record, struct, interface or enum defined in a file. |\n| Run mode | A way to start the program, picked by its first argument. |\n| Sub-command | A sub-command of a command-line parser. |\n| Dispatch table | A switch or mapping that turns an operation name into the code that handles it. |\n| Operation | One named operation of a dispatch table. |\n| HTTP route | An HTTP endpoint the program serves. |\n| MCP tool | A tool the program offers to AI clients over MCP. |\n| Environment variable | An environment variable the code reads or sets (operating-system variables are left out). |\n| Port | A network port number found in an address or a port setting. |\n| Package | A third-party package the project declares or imports. |\n| External host | A host name found in a URL. |\n| Command-line tool | A well-known program the project's scripts start; it has to be installed. |\n| Person | An author in the Git history. |\n| User type | A kind of user the analysed application tells apart, found from role checks. Not an access level of this pack. |\n| Screen | A template or page a user sees. |\n| Screen term | Words a user reads: a link, button, field label, heading, or a message the code shows. |\n| Function | Project code that a feature runs. Modelled once, however many features use it. |\n| Data table | A table named in an SQL statement. |\n| State | A column value that statements set or filter on, such as status = 'published'. |\n| Asset | A file users see or provide: shipped with the project, uploaded, generated, or kept in external storage. |\n\n## Relations\n\n| Relation | Read backwards | Meaning |\n|---|---|---|\n| contains | is part of | Project → area → file. |\n| defines | is defined in | The file holds the definition. |\n| imports | is imported by | Import or include statement. |\n| uses | is used by | The code names a type defined in the other file; a run mode uses a type. |\n| takes as a dependency | is a dependency of | Constructor parameter of that type. |\n| extends | is extended by | Base class or implemented interface. |\n| loads | is loaded by | A page loads a script or stylesheet. |\n| runs | is run by | A script or configuration starts the other file. |\n| refers to | is referred to by | A string in the file is the other file's path. |\n| references | is referenced by | Project reference in a build file. |\n| documents | is documented in | A document links to the file or shows the operation in an example. |\n| serves | is served by | A run mode passes requests to the dispatch table. |\n| exposes | is exposed by | A run mode registers the HTTP route. |\n| has operation | is an operation of | Key of the dispatch table. |\n| is handled by | handles | The file that holds the handler the table calls. |\n| calls | is called from | The file asks for the operation by name (over HTTP, a process or in-process). |\n| invokes | is invoked by | An MCP tool runs the operation. |\n| forwards to | receives from | An HTTP route hands the request to the dispatch table. |\n| reads | is read by | The file reads the environment variable. |\n| sets | is set by | The file sets the environment variable. |\n| mentions | is mentioned in | The host or port appears in the file. |\n| depends on | is a dependency of | The file declares or imports the package. |\n| starts | is started by | The file starts the command-line tool. |\n| has commits in | has commits by | Author in the Git history of the project. |\n| is open to | may use | Role check on the route, or none found (anyone). |\n| sees | is seen by | A route this user type may use shows the screen. |\n| shows | is shown by | The route renders the screen. |\n| is built on | is part of | The template extends or includes the other one. |\n| displays | is displayed on | The words are on the screen, or the route shows the message. |\n| leads to | is started from | The link, button or form of the term targets the route; a script of the screen calls it. |\n| redirects to | is reached by redirect from | The handler redirects to the other route. |\n| runs | runs for | The handler calls the function, directly or through other functions. |\n| reads | is read by | An SQL statement of the feature reads the table. |\n| writes | is written by | An SQL statement of the feature inserts, updates or deletes rows. |\n| has the state | is a state of | A literal column value found in a statement. |\n| sets | is set by | A statement of the feature sets the column to this value. |\n| lists only | is the filter of | A statement of the feature filters on this value. |\n| is tested by | tests | A template condition or a handler branch names the same column and value. |\n| hands over to | receives from | One feature sets a state that the other filters on. |\n| shows | appears on | The screen references the file. |\n| provides | is provided by | The feature receives the upload or writes the generated file. |\n| delivers | is delivered by | The route sends the file to the browser. |\n| has its name kept in | keeps the name of | The stored file name is written to a column of the table. |\n| takes its text from | words | The text of the term comes from a locale file. |\n\n## Writing\n\nDo not edit these pages: the next run overwrites them. Knowledge that should last goes into `HANDOFF.notes.md`, under the heading of the thing it is about:\n\n- `## Project` — what the project is and its status\n- `## Topic: <name>` — the handover questions listed in [notes.md](notes.md)\n- `## Area: <folder>`, `## File: <path>`, `## Mode: <name>`, `## Op: <operation>` — one thing each\n- `## User: <user type>` — who these users are in real life and what they usually ask for\n\nWrite plain sentences, say only what you verified in the source, and never paste a password or token; say where it is kept. Then run `python -m handoff247 <project folder>` again: the note appears on the matching wiki page, in the handoff pages and in the viewer.\n\n## Files\n\n- `../llms.txt` — short entry point; `../llms-full.txt` — every page of this wiki in one file\n- `../ontology.json` — entities (`id`, `type`, `name`, `summary`, `page`) and relations (`s`, `p`, `o`, `file`, `line`)\n- `../index.html` — viewer with a graph of the same ontology\n\n## Working through MCP\n\n`python -m handoff247 mcp` is an MCP server over the same data: a briefing of the whole project, the flows of each user type, a search from a user's own words, one feature in full, assets, the effect of a code change, entities, source lines, what is still undocumented, and notes written under the right heading (marked as written by an agent). It is the supported way for an assistant to add to this wiki.\n", "wiki/overview.md": "---\ngenerator: HandOff247\nid: \"project:HandOff247\"\ntype: Project\n---\n\n# HandOff247\n\n**What the previous owner says it is**\n\n> HandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\n> Status: v0.6.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. Since v0.4.0 every pack also holds the ontology (`ontology.json`), a graph of it in the viewer, and a wiki for AI assistants (`wiki/`, `llms.txt`). v0.6.0 adds the user-context view: who uses the analysed application (user types found from role checks), what each of them sees and can do, how work passes from one user type to the next, the words on the screens, and assets in context (USERS.md, the Users tab, `handoff247 trace`, seven more MCP tools; see `examples/newsroom`). v0.5.0 added optional file summaries written through the signed-in Codex CLI (`--summarize`) and an MCP server (`handoff247 mcp`) through which an AI agent reads the project and writes notes. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n- **Repository:** https://github.com/unkkyuist/HandOff247 at commit `f0caf56`\n- **Human-readable pack:** [README](../README.md), [handover checklist](../HANDOVER.md), [how to run it](../RUNNING.md), [connections](../CONNECTIONS.md), [code map](../CODEMAP.md)\n- **What only the previous owner knew:** [notes](notes.md)\n\n## What was found\n\n| Class | Count | Where |\n|---|---|---|\n| Areas | 3 | [index](index.md), under Areas |\n| Files | 41 | [index](index.md), under Files |\n| Types | 24 | on the page of the file that defines it |\n| Sub-commands | 6 | [subcommands.md](subcommands.md) |\n| Dispatch tables | 4 | [operations.md](operations.md) |\n| Operations | 39 | [index](index.md), under Operations |\n| Ports | 1 | [ports.md](ports.md) |\n| External hosts | 4 | [hosts.md](hosts.md) |\n| Command-line tools | 2 | [commands.md](commands.md) |\n| People | 1 | [people.md](people.md) |\n\n## Relations\n\n**contains** →\n\n- [`.github`](areas/github.md)\n- [`handoff247`](areas/handoff247.md)\n- [`tests`](areas/tests.md)\n- [`.gitignore`](files/gitignore.md)\n- [`.handoffignore`](files/handoffignore.md)\n- [`HANDOFF.notes.md`](files/HANDOFF.notes.md.md)\n- [`LICENSE`](files/LICENSE.md)\n- [`README.md`](files/README.md.md)\n- [`action.yml`](files/action.yml.md)\n- [`pyproject.toml`](files/pyproject.toml.md)\n\n**has commits by** ←\n\n- [R B](people.md)\n", "wiki/notes.md": "---\ngenerator: HandOff247\n---\n\n# Notes from the previous owner\n\nWritten by a person in `HANDOFF.notes.md`; nothing on this page was derived from code. A question without an answer is a real gap: ask, do not guess.\n\n## What the project is\n\nHandOff247 reads a project folder and writes a handoff pack for the next person: diagrams, structure, extracted comments and a map of how the tools connect. It is static analysis only (it never imports or runs the target's code) and it is standard-library Python, so `python -m handoff247` works on any machine with Python 3.10+.\nStatus: v0.6.0. `python -m handoff247 <folder>` does everything in one step (notes file, pack, handover checklist), and a folder that holds several projects gets one pack per project plus an index. Since v0.4.0 every pack also holds the ontology (`ontology.json`), a graph of it in the viewer, and a wiki for AI assistants (`wiki/`, `llms.txt`). v0.6.0 adds the user-context view: who uses the analysed application (user types found from role checks), what each of them sees and can do, how work passes from one user type to the next, the words on the screens, and assets in context (USERS.md, the Users tab, `handoff247 trace`, seven more MCP tools; see `examples/newsroom`). v0.5.0 added optional file summaries written through the signed-in Codex CLI (`--summarize`) and an MCP server (`handoff247 mcp`) through which an AI agent reads the project and writes notes. The first real target was PlayBookOS (see examples/playbookos). C#, Python, JavaScript/TypeScript, PowerShell, shell and batch have analyzers; other languages are inventoried but not parsed. Output is English; a project's own comments and headings in another language get English versions from the notes file's `## Translations` table.\n\n## Successor checklist\n\n1. Run the tests: `python -m unittest discover -s tests`.\n2. Regenerate the examples after any analyzer change (`examples/newsroom` too: `python -m handoff247 build tests/fixtures/newsroom --name Newsroom -o examples/newsroom --notes examples/newsroom.notes.md --date <date> --link-base https://github.com/unkkyuist/HandOff247/blob/main/tests/fixtures/newsroom/`): `python -m handoff247 build <PlayBookOS checkout> --name PlayBookOS -o examples/playbookos --notes examples/playbookos.notes.md --date <date>`. If an analyzer change surfaces new Korean comments or headings, `check --notes examples/playbookos.notes.md` reports them; add their rows to the Translations table there. Read the diff of the generated pages: a change there is a change in what successors will be told.\n3. Regenerate this pack after committing and pushing, so its Handover page does not report your own work as uncommitted: `python -m handoff247 . --date <date>`.\n4. Open `index.html` of a pack in a browser and check that every diagram renders (Mermaid errors show as red text in the page).\n\n## Known issues and risks\n\n- The rule that matters most: a wrong statement is worse than a missing one. When a pattern is ambiguous the analyzers leave it out; inferences (for example a wrapper passed in as a parameter) are labelled and drawn dashed. Keep it that way.\n- Analysis is regex/lexer based for everything except Python (which uses `ast`). Code built from runtime strings, reflection or dependency-injection containers is not followed.\n- MCP tool names from the C# SDK are derived from method names (snake_case, `Async` removed) and marked with * in the pack.\n- Mermaid labels must go through `mermaid.esc`; `*`, `_` and backticks are escaped because Mermaid otherwise formats them as Markdown.\n\n## Credentials and accounts\n\nNone. The tool needs no keys. The GitHub Action only uses the workflow's own checkout.\n\n## Open work and next steps\n\n- A folder of projects has a graph and a wiki per project but no single graph across projects; `workspace.py` only writes an `llms.txt` that links them.\n- Codex is the only engine for `--summarize` (`summarize.codex_call`). Another signed-in CLI (Claude Code's `claude -p`, for example) would be a second function with the same signature: prompt in, JSON text out.\n- The MCP server is tested by driving it over stdio (`test_mcp_server`) and was tried once by hand with Codex. It speaks protocol versions up to 2025-11-25 and offers tools only, no resources or prompts.\n- The user-context view follows Python handlers only (Flask-style routes, SQL written as strings). An ORM, Django URL patterns, and handlers in JavaScript or C# are not followed; their routes are listed with what sits on the route itself and reported under \"Not verified\". Controls of a single-page app that a script wires up are listed without a target. The next analyzers to write are an Express handler reader and an ORM model reader, each with an assertion per fact in `UserContextTests`.\n- Go, Rust, Java and other languages are only inventoried. An analyzer for one of them is the natural next piece: copy the shape of `analyzers/python.py` and add an assertion per fact to the tests.\n- The workspace index has no example in `examples/`; it is covered by `test_go_folder_of_projects` only.\n\n## Deploy and release\n\nThere is no server and no package upload. A release is a push to `main` on GitHub; people run it from a clone or use the repository as a GitHub Action (`uses: unkkyuist/HandOff247@main`), so `main` is what users get. Bump the version in `handoff247/__init__.py` and `pyproject.toml` together. To roll back, revert the commit.\n\n## Routine operations\n\nNothing runs on a schedule. CI runs on every push and pull request. The viewer loads marked, DOMPurify and Mermaid from jsDelivr at pinned versions (`render_html.py`); check now and then that those versions still load.\n\n## Data and backups\n\nThe tool stores nothing. Its only state is the Git repository. Generated packs can always be rebuilt; a project's `HANDOFF.notes.md` cannot, so it belongs in that project's repository.\n\n## People and contacts\n\nOwner: the GitHub account `unkkyuist` (issues on the repository). There are no other maintainers and no known outside users yet.\n", "wiki/operations.md": "---\ngenerator: HandOff247\n---\n\n# Dispatch tables\n\nA switch or mapping that turns an operation name into the code that handles it.\n\n4 found. [Back to the index](index.md)\n\n## `handoff247/analyzers/__init__.py:7`\n\n> 17 operation(s), picked by `dict`\n\n- **Class:** Dispatch table — A switch or mapping that turns an operation name into the code that handles it.\n- **Source:** [handoff247/analyzers/__init__.py:7](../../../handoff247/analyzers/__init__.py#L7)\n\n**has operation** →\n\n- [`batch`](operations/batch.md) · [handoff247/analyzers/__init__.py: ic analysis only (it never imports or runs the targe…", "page": "wiki/overview.md"}, {"id": "area:.github", "type": "Area", "name": ".github", "summary": "CI: unit tests on Linux and Windows (Python 3.10 and 3.12), a self-documentation run, and a run of the composite action against the test fixture.", "page": "wiki/areas/github.md"}, {"id": "area:handoff247", "type": "Area", "name": "handoff247", "summary": "The package. Data flows inventory → analyzers → connect → (mermaid, render_md, render_html) → build. pipeline.py wires the first three; cli.py and build.py the rest.", "page": "wiki/areas/handoff247.md"}, {"id": "area:tests", "type": "Area", "name": "tests", "summary": "`test_handoff.py` plus two fixtures. `fixtures/newsroom` is a small Flask application with three user types (author, editor, anyone) used by `UserContextTests`: one user type's action, the code, the data and upload it c…", "page": "wiki/areas/tests.md"}, {"id": "file:.github/workflows/ci.yml", "type": "File", "name": ".github/workflows/ci.yml", "summary": "CI workflow: CI", "page": "wiki/files/github__workflows__ci.yml.md"}, {"id": "file:.gitignore", "type": "File", "name": ".gitignore", "page": "wiki/files/gitignore.md"}, {"id": "file:.handoffignore", "type": "File", "name": ".handoffignore", "page": "wiki/files/handoffignore.md"}, {"id": "file:action.yml", "type": "File", "name": "action.yml", "page": "wiki/files/action.yml.md"}, {"id": "file:HANDOFF.notes.md", "type": "File", "name": "HANDOFF.notes.md", "summary": "HandOff247 notes.", "page": "wiki/files/HANDOFF.notes.md.md"}, {"id": "file:handoff247/__init__.py", "type": "File", "name": "handoff247/__init__.py", "summary": "Holds `__version__`; the version is printed in every generated page.", "page": "wiki/files/handoff247____init__.py.md"}, {"id": "file:handoff247/__main__.py", "type": "File", "name": "handoff247/__main__.py", "summary": "Lets `python -m handoff247` run the CLI.", "page": "wiki/files/handoff247____main__.py.md"}, {"id": "file:handoff247/analyzers/__init__.py", "type": "File", "name": "handoff247/analyzers/__init__.py", "summary": "Maps a file's language to its analyzer. An exception inside one analyzer marks only that file as \"not parsed\"; it never stops the run.", "page": "wiki/files/handoff247__analyzers____init__.py.md"}, {"id": "file:handoff247/analyzers/csharp.py", "type": "File", "name": "handoff247/analyzers/csharp.py", "summary": "The richest analyzer: types and primary-constructor dependencies, entry modes (`if (mode == \"x\")` in the entry file), `switch` dispatch tables with handler resolution, minimal-API routes, `[McpServerTool]` methods, envi…", "page": "wiki/files/handoff247__analyzers__csharp.py.md"}, {"id": "file:handoff247/analyzers/docs.py", "type": "File", "name": "handoff247/analyzers/docs.py", "summary": "Markdown (summary, headings, relative links, code blocks for `<mode> <op>` usage), plus config formats: .csproj, package.json, pyproject, requirements, MCP client configs (`mcpServers` / `[mcp_servers]`), Dockerfile, Gi…", "page": "wiki/files/handoff247__analyzers__docs.py.md"}, {"id": "file:handoff247/analyzers/python.py", "type": "File", "name": "handoff247/analyzers/python.py", "summary": "Uses `ast`, never imports the file. Finds argparse sub-commands, subprocess launches (rendered with `{variable}` placeholders), env reads/writes, dict/if-chain/match dispatch tables, Flask/FastAPI routes and MCP tool de…", "page": "wiki/files/handoff247__analyzers__python.py.md"}, {"id": "file:handoff247/analyzers/shell.py", "type": "File", "name": "handoff247/analyzers/shell.py", "summary": "PowerShell, POSIX shell and batch: leading comment / .SYNOPSIS as summary, `$env:` / `export` / `set` variables, and command lines that launch something (dotnet, python, powershell -File, `&` call operator, start URL).", "page": "wiki/files/handoff247__analyzers__shell.py.md"}, {"id": "file:handoff247/analyzers/web.py", "type": "File", "name": "handoff247/analyzers/web.py", "summary": "JavaScript/TypeScript (imports, exported functions with spans, `fetch` calls, Express routes, MCP registrations, `case` tables), HTML (`<script src>`, `<link>`, inline scripts) and CSS imports.", "page": "wiki/files/handoff247__analyzers__web.py.md"}, {"id": "file:handoff247/build.py", "type": "File", "name": "handoff247/build.py", "summary": "Writes the pack: seven Markdown pages, `diagrams/*.mmd`, `handoff.json` (its first key `\"generator\": \"HandOff247\"` is how later runs recognise and skip an old pack), `ontology.json`, the wiki and `index.html`. `write_wi…", "page": "wiki/files/handoff247__build.py.md"}, {"id": "file:handoff247/cli.py", "type": "File", "name": "handoff247/cli.py", "summary": "Six commands: `go`, `build`, `notes`, `check`, `mcp`, `trace`. `trace` answers a question from the user's side (a request in words, a user type, a feature, an asset, a code file) without writing a pack. A first argument…", "page": "wiki/files/handoff247__cli.py.md"}, {"id": "file:handoff247/connect.py", "type": "File", "name": "handoff247/connect.py", "summary": "Turns per-file facts into edges and connection maps. The key idea: string keys of a dispatch table (`\"list\"`, `\"ontology.search\"`) are followed to every caller (`api('list')`, `cli('list')`, `Call(\"list\")`, `cli list` i…", "page": "wiki/files/handoff247__connect.py.md"}, {"id": "file:handoff247/explore.py", "type": "File", "name": "handoff247/explore.py", "summary": "`Explorer` answers a successor's questions from the journeys model: `users`/`user_flow` (from a user type), `find` (from words on a screen or a user's request), `asset` (from an asset or table), `impact` (from code), `f…", "page": "wiki/files/handoff247__explore.py.md"}, {"id": "file:handoff247/handlers.py", "type": "File", "name": "handoff247/handlers.py", "summary": "What a route does. `PyIndex` follows a Python handler through `ast` into the project functions it calls (four levels deep) and records every effect with its file, line, call chain (`via`), the handler line that led ther…", "page": "wiki/files/handoff247__handlers.py.md"}, {"id": "file:handoff247/inventory.py", "type": "File", "name": "handoff247/inventory.py", "summary": "Lists files with `git ls-files` (so .gitignore applies), falls back to a directory walk, applies `.handoffignore` and skips folders that contain an earlier pack.", "page": "wiki/files/handoff247__inventory.py.md"}, {"id": "file:handoff247/journeys.py", "type": "File", "name": "handoff247/journeys.py", "summary": "Joins screens.py and handlers.py into `project.links[\"journeys\"]`: user types, screens, terms, features (one per route), data tables with states, assets, hand-overs, shared functions and gaps. `match_path` fits a path w…", "page": "wiki/files/handoff247__journeys.py.md"}, {"id": "file:handoff247/labels.py", "type": "File", "name": "handoff247/labels.py", "summary": "Every generated heading and label, in one table, so pages and diagrams use the same words. Extracted comments and notes never pass through it.", "page": "wiki/files/handoff247__labels.py.md"}, {"id": "file:handoff247/leaving.py", "type": "File", "name": "handoff247/leaving.py", "summary": "The handover findings: Git state (uncommitted, commits on no remote, stashes, authors), files Git ignores that are present, absolute paths, hosts in URLs, TODO comments, key and token patterns, declared tool versions, a…", "page": "wiki/files/handoff247__leaving.py.md"}, {"id": "file:handoff247/lexer.py", "type": "File", "name": "handoff247/lexer.py", "summary": "Produces two views of C-like source with identical offsets: strings+comments blanked (for identifiers) and comments blanked (for literal patterns). Handles C# verbatim, interpolated and raw strings and JS template and r…", "page": "wiki/files/handoff247__lexer.py.md"}, {"id": "file:handoff247/mcp.py", "type": "File", "name": "handoff247/mcp.py", "summary": "The MCP server (`handoff247 mcp`): newline-delimited JSON-RPC on stdin/stdout, with `sys.stdout` pointed at stderr so stray prints cannot corrupt the protocol. Thirteen tools; only `handoff_write_note` and `handoff_buil…", "page": "wiki/files/handoff247__mcp.py.md"}, {"id": "file:handoff247/mermaid.py", "type": "File", "name": "handoff247/mermaid.py", "summary": "Builds the six diagrams. `users_map` groups screens by who sees them and joins them through the states and files that pass work on. `system` collapses launch scripts into one node when there are more than three; `code`…", "page": "wiki/files/handoff247__mermaid.py.md"}, {"id": "file:handoff247/model.py", "type": "File", "name": "handoff247/model.py", "summary": "Dataclasses: FileInfo, Symbol, Fact, Edge, Project. A Fact is one observation with a file and line; everything in the pack traces back to one.", "page": "wiki/files/handoff247__model.py.md"}, {"id": "file:handoff247/notes.py", "type": "File", "name": "handoff247/notes.py", "summary": "Parses and extends the notes file. `update` only appends missing headings and missing Translations rows; it never rewrites existing text. Stale headings (for deleted files) are reported, not removed.", "page": "wiki/files/handoff247__notes.py.md"}, {"id": "file:handoff247/ontology.py", "type": "File", "name": "handoff247/ontology.py", "summary": "Turns `project.links` and `project.edges` into typed entities and relations. It detects nothing itself; add a new kind of fact in an analyzer or in `connect.py` first, then map it here. `CLASSES` and `RELATIONS` are the…", "page": "wiki/files/handoff247__ontology.py.md"}, {"id": "file:handoff247/pipeline.py", "type": "File", "name": "handoff247/pipeline.py", "summary": "analyze_project(): inventory, per-file analysis, linking.", "page": "wiki/files/handoff247__pipeline.py.md"}, {"id": "file:handoff247/render_html.py", "type": "File", "name": "handoff247/render_html.py", "summary": "The single-file viewer. It embeds the Markdown pages and loads marked, DOMPurify and Mermaid from jsDelivr at pinned versions. Diagram nodes <script>

// Picking a user type brings its flow forward. Nothing is removed: the other flows stay on the

function markUser(page) {
  const users = new Set(DATA.users || []);
  page.querySelectorAll('.ud,.uf').forEach(el => el.classList.remove('ud', 'uf'));
  if (!focusUser) return;
  let state = '';                                   // '' outside a user section, 'f' inside the chosen one, 'd' inside another
  for (const el of page.children) {
    if (el.tagName === 'H2') { state = ''; continue; }
    if (el.tagName === 'H3') {
      const name = el.querySelector('code')?.textContent.trim();
      state = users.has(name) ? (name === focusUser ? 'f' : 'd') : '';
      if (state) el.classList.add(state === 'f' ? 'uf' : 'ud');

    if (el.tagName !== 'TABLE') continue;

const ONT = DATA.ontology || {classes: [], relations: [], entities: [], triples: []};
